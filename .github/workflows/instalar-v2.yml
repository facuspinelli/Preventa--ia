name: Restaurar PREVENTA IA V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar ZIP V1
        run: |
          ZIP="Preventa--ia-main.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            ls -la
            exit 1
          fi

          echo "ZIP V1 encontrado correctamente."

      - name: Extraer V1
        run: |
          rm -rf _restore
          mkdir _restore

          unzip -q "Preventa--ia-main.zip" -d _restore

          echo "Contenido extraído:"
          find _restore -maxdepth 2 -type f | sort

      - name: Detectar carpeta V1
        run: |
          ROOT=$(find _restore -type f -name "index.html" -printf '%h\n' | head -1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró index.html dentro del ZIP."
            exit 1
          fi

          echo "V1 encontrada en: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verificar archivos V1
        run: |
          archivos=(
            "index.html"
            "asistente.html"
            "biblioteca.html"
            "conocimiento.json"
            "conocimientoiaasistente.html"
            "cotizador.html"
            "documentos.html"
            "mercado.html"
            "oportunidades.html"
            "repositorio.html"
            "analisis.html"
            "package.json"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "$ROOT/$archivo" ]; then
              echo "ERROR: Falta $archivo"
              exit 1
            fi
          done

          echo "V1 verificada correctamente."

      - name: Restaurar archivos V1
        run: |
          echo "Eliminando archivos actuales..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "_restore" \
            ! -name "Preventa--ia-main.zip" \
            -exec rm -rf {} +

          echo "Copiando V1 sin modificar .github/workflows..."

          find "$ROOT" -mindepth 1 -maxdepth 1 ! -name ".github" -exec cp -a {} . \;

          echo "Restauración de archivos completada."

      - name: Limpiar
        run: |
          rm -rf _restore
          rm -f "Preventa--ia-main.zip"

      - name: Guardar restauración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi

          git commit -m "Restaurar PREVENTA IA V1"
          git push origin main
