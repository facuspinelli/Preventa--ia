name: Instalar PREVENTA IA V2

on:
  push:
    paths:
      - 'PREVENTA-IA-V2-WINDOWS.zip'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar V2
        run: |
          rm -rf _v2
          mkdir _v2
          unzip -q PREVENTA-IA-V2-WINDOWS.zip -d _v2
          rm -rf _v2/.github
          cp -a _v2/. .
          rm -rf _v2 PREVENTA-IA-V2-WINDOWS.zip

      - name: Guardar V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Instalar PREVENTA IA V2" || echo "Sin cambios"
          git push
