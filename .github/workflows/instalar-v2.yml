name: Instalar PREVENTA IA V3

on:
  workflow_dispatch:
  push:
    paths:
      - 'PREVENTA-IA-INTEGRADO-ARCHIVOS-V3.zip'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar paquete V3
        run: |
          ZIP="PREVENTA-IA-INTEGRADO-ARCHIVOS-V3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            echo "Archivos disponibles en la raíz:"
            ls -la
            exit 1
          fi

          echo "Paquete encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extraer V3
        run: |
          rm -rf _v3
          mkdir _v3
          unzip -q "$ZIP" -d _v3

      - name: Verificar V3
        run: |
          archivos=(
            "index.html"
            "asistente.html"
            "oportunidades.html"
            "analisis.html"
            "documentos.html"
            "cotizador.html"
            "mercado.html"
            "biblioteca.html"
            "repositorio.html"
            "conocimientoiaasistente.html"
            "preventa-core.js"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "_v3/$archivo" ]; then
              echo "ERROR: Falta $archivo en V3"
              exit 1
            fi
          done

          echo "V3 validada correctamente."

      - name: Instalar V3
        run: |
          cp _v3/index.html .
          cp _v3/asistente.html .
          cp _v3/oportunidades.html .
          cp _v3/analisis.html .
          cp _v3/documentos.html .
          cp _v3/cotizador.html .
          cp _v3/mercado.html .
          cp _v3/biblioteca.html .
          cp _v3/repositorio.html .
          cp _v3/conocimientoiaasistente.html .
          cp _v3/cotizador.html .
          cp _v3/preventa-core.js .

          if [ -d "_v3/lib" ]; then
            mkdir -p lib
            cp -a _v3/lib/. lib/
          fi

          if [ -d "_v3/data" ]; then
            mkdir -p data
            cp -a _v3/data/. data/
          fi

          if [ -d "_v3/api" ]; then
            mkdir -p api
            cp -a _v3/api/. api/
          fi

          if [ -d "_v3/docs" ]; then
            mkdir -p docs
            cp -a _v3/docs/. docs/
          fi

          if [ -f "_v3/conocimiento.json" ]; then
            cp _v3/conocimiento.json .
          fi

          if [ -f "_v3/package.json" ]; then
            cp _v3/package.json .
          fi

      - name: Limpiar instalador
        run: |
          rm -rf _v3
          rm -f "$ZIP"

      - name: Guardar V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Instalar PREVENTA IA V3 completa"
          git push origin main
