name: Instalar PREVENTA IA FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - 'PREVENTA-IA-FINAL-FUNCIONAL.zip'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar paquete final
        run: |
          ZIP="PREVENTA-IA-FINAL-FUNCIONAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            ls -la
            exit 1
          fi

          echo "Paquete final encontrado: $ZIP"

      - name: Extraer paquete final
        run: |
          rm -rf _final
          mkdir _final
          unzip -q PREVENTA-IA-FINAL-FUNCIONAL.zip -d _final

      - name: Verificar archivos funcionales
        run: |
          archivos=(
            "index.html"
            "asistente.html"
            "oportunidades.html"
            "documentos.html"
            "analisis.html"
            "cotizador.html"
            "mercado.html"
            "biblioteca.html"
            "repositorio.html"
            "conocimientoiaasistente.html"
            "preventa-core.js"
            "conocimiento.json"
            "api/chat.js"
            "api/mercado.js"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "_final/$archivo" ]; then
              echo "ERROR: Falta $archivo"
              exit 1
            fi
          done

          echo "OK: paquete final validado."

      - name: Instalar sistema final
        run: |
          cp _final/index.html .
          cp _final/asistente.html .
          cp _final/oportunidades.html .
          cp _final/documentos.html .
          cp _final/analisis.html .
          cp _final/cotizador.html .
          cp _final/mercado.html .
          cp _final/biblioteca.html .
          cp _final/repositorio.html .
          cp _final/conocimientoiaasistente.html .
          cp _final/preventa-core.js .
          cp _final/conocimiento.json .
          cp _final/package.json .

          mkdir -p api data docs
          cp -a _final/api/. api/
          cp -a _final/data/. data/
          cp -a _final/docs/. docs/

      - name: Limpiar paquete
        run: |
          rm -rf _final
          rm -f PREVENTA-IA-FINAL-FUNCIONAL.zip

      - name: Guardar sistema final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Instalar PREVENTA IA funcional integrada"
          git push origin main
