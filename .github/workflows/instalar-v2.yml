name: Instalar PREVENTA IA Integrado

on:
  workflow_dispatch:
  push:
    paths:
      - 'PREVENTA-IA-INTEGRADO-ARCHIVOS*.zip'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar paquete integrado
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'PREVENTA-IA-INTEGRADO-ARCHIVOS*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el paquete integrado."
            echo "Archivos disponibles:"
            ls -la
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extraer paquete
        run: |
          rm -rf _integrado
          mkdir _integrado
          unzip -q "$ZIP" -d _integrado

      - name: Verificar archivos
        run: |
          archivos=(
            "analisis.html"
            "asistente.html"
            "biblioteca.html"
            "conocimientoiaasistente.html"
            "cotizador.html"
            "documentos.html"
            "index.html"
            "mercado.html"
            "oportunidades.html"
            "repositorio.html"
            "preventa-core.js"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "_integrado/$archivo" ]; then
              echo "ERROR: Falta $archivo"
              exit 1
            fi
          done

          echo "OK: todos los archivos fueron encontrados."

      - name: Instalar archivos integrados
        run: |
          cp _integrado/analisis.html .
          cp _integrado/asistente.html .
          cp _integrado/biblioteca.html .
          cp _integrado/conocimientoiaasistente.html .
          cp _integrado/cotizador.html .
          cp _integrado/documentos.html .
          cp _integrado/index.html .
          cp _integrado/mercado.html .
          cp _integrado/oportunidades.html .
          cp _integrado/repositorio.html .
          cp _integrado/preventa-core.js .

          if [ -d "_integrado/docs" ]; then
            mkdir -p docs
            cp -a _integrado/docs/. docs/
          fi

      - name: Eliminar ZIP
        run: |
          rm -rf _integrado
          rm -f "$ZIP"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Instalar PREVENTA IA Integrado"
          git push origin main
