name: Restaurar PREVENTA IA V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'Preventa--ia-main(1).zip'

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar ZIP V1
        run: |
          ZIP="Preventa--ia-main(1).zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            ls -la
            exit 1
          fi

          echo "ZIP V1 encontrado."

      - name: Extraer V1
        run: |
          rm -rf _restore
          mkdir _restore

          unzip -q "Preventa--ia-main(1).zip" -d _restore

          echo "Contenido extraído:"
          find _restore -maxdepth 2 -type f | sort

      - name: Verificar V1
        run: |
          ROOT="_restore/Preventa--ia-main"

          archivos=(
            "index.html"
            "asistente.html"
            "biblioteca.html"
            "conocimiento.json"
            "conocimientoiaasistente.html"
            "cotizador.html"
            "documentos.html"
            "mercado.html"
            "oportunidades.html"
            "repositorio.html"
            "analisis.html"
            "package.json"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "$ROOT/$archivo" ]; then
              echo "ERROR: Falta $archivo"
              exit 1
            fi
          done

          echo "V1 verificada correctamente."

      - name: Restaurar V1 completa
        run: |
          ROOT="_restore/Preventa--ia-main"

          echo "Eliminando archivos actuales..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "_restore" \
            -exec rm -rf {} +

          echo "Copiando V1..."

          cp -a "$ROOT"/. .

          rm -rf _restore
          rm -f "Preventa--ia-main(1).zip"

      - name: Guardar restauración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi

          git commit -m "Restaurar PREVENTA IA V1"
          git push origin main
