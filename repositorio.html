<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Repositorio | PREVENTA IA</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

header {
  background: #111827;
  color: white;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}

.welcome {
  margin-bottom: 30px;
}

.welcome h2 {
  margin-bottom: 8px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.summary-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.summary-title {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 8px;
}

.summary-value {
  font-size: 25px;
  font-weight: bold;
}

.search-box {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.search-box input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

.opportunities {
  display: grid;
  gap: 18px;
}

.opportunity {
  background: white;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.opportunity-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.opportunity-title h3 {
  margin: 0 0 7px 0;
  font-size: 20px;
}

.opportunity-title p {
  margin: 4px 0;
  color: #6b7280;
  font-size: 14px;
}

.status {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 8px;
}

.analysis {
  background: #fef3c7;
  color: #92400e;
}

.quote {
  background: #dbeafe;
  color: #1e40af;
}

.proposal {
  background: #e0e7ff;
  color: #3730a3;
}

.won {
  background: #dcfce7;
  color: #166534;
}

.lost {
  background: #fee2e2;
  color: #991b1b;
}

.data-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.data-card {
  background: #f9fafb;
  padding: 14px;
  border-radius: 8px;
}

.data-label {
  font-size: 11px;
  color: #6b7280;
  margin-bottom: 5px;
}

.data-value {
  font-weight: bold;
  font-size: 14px;
  white-space: pre-wrap;
}

.quote-section {
  margin-top: 22px;
  padding: 18px;
  border-radius: 10px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
}

.quote-title {
  font-weight: bold;
  margin-bottom: 15px;
  color: #166534;
}

.quote-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.quote-card {
  padding: 16px;
  border-radius: 8px;
  background: white;
  border: 1px solid #dcfce7;
}

.quote-label {
  font-size: 11px;
  color: #6b7280;
}

.quote-value {
  font-weight: bold;
  font-size: 19px;
  margin-top: 5px;
  color: #166534;
}

.no-quote {
  margin-top: 22px;
  padding: 14px;
  border-radius: 8px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 13px;
}

.actions {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
  font-size: 13px;
  background: #111827;
  color: white;
}

button:hover {
  background: #374151;
}

.edit {
  background: #2563eb;
}

.edit:hover {
  background: #1d4ed8;
}

.green {
  background: #166534;
}

.green:hover {
  background: #15803d;
}

.red {
  background: #dc2626;
}

.red:hover {
  background: #b91c1c;
}

.secondary {
  background: #e5e7eb;
  color: #1f2937;
}

.secondary:hover {
  background: #d1d5db;
}

.detail {
  display: none;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #e5e7eb;
}

.detail-section {
  margin-bottom: 20px;
}

.detail-section h4 {
  margin-bottom: 8px;
}

.detail-text {
  background: #f9fafb;
  padding: 14px;
  border-radius: 8px;
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 14px;
}

.empty {
  background: white;
  border-radius: 12px;
  padding: 50px;
  text-align: center;
  color: #6b7280;
}

/* =========================
   MODAL EDITAR
========================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 100;
}

.modal-content {
  width: 100%;
  max-width: 850px;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 14px;
  padding: 30px;
}

.modal-content h3 {
  margin-top: 0;
}

.modal-subtitle {
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 25px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #2563eb;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

@media (max-width: 800px) {

  header {
    flex-direction: column;
    gap: 15px;
  }

  .summary {
    grid-template-columns: repeat(2, 1fr);
  }

  .data-grid,
  .quote-grid,
  .form-grid {
    grid-template-columns: 1fr 1fr;
  }

  .opportunity-header {
    flex-direction: column;
  }

}

@media (max-width: 550px) {

  .summary,
  .data-grid,
  .quote-grid,
  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

}

</style>

</head>

<body>

<header>

  <h1>🗂️ PREVENTA IA</h1>

  <a
    href="index.html"
    class="back"
  >
    ← Volver al inicio
  </a>

</header>


<main class="container">

  <div class="welcome">

    <h2>
      🗂️ Repositorio de Preventa
    </h2>

    <p>
      Historial centralizado de oportunidades,
      análisis y cotizaciones.
    </p>

  </div>


  <!-- RESUMEN -->

  <div class="summary">

    <div class="summary-card">

      <div class="summary-title">
        OPORTUNIDADES
      </div>

      <div
        class="summary-value"
        id="totalOpportunities"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-title">
        EN ANÁLISIS
      </div>

      <div
        class="summary-value"
        id="analysisCount"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-title">
        COTIZADAS
      </div>

      <div
        class="summary-value"
        id="quoteCount"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-title">
        GANADAS
      </div>

      <div
        class="summary-value"
        id="wonCount"
      >
        0
      </div>

    </div>

  </div>


  <!-- BUSQUEDA -->

  <div class="search-box">

    <input
      id="search"
      type="text"
      placeholder="🔎 Buscar por cliente, oportunidad o solución..."
      oninput="renderRepository()"
    >

  </div>


  <!-- LISTA -->

  <div
    id="opportunities"
    class="opportunities"
  ></div>

</main>


<!-- =========================
     MODAL EDITAR
========================= -->

<div
  id="editModal"
  class="modal"
>

  <div class="modal-content">

    <h3>
      ✏️ Editar oportunidad
    </h3>

    <p class="modal-subtitle">
      Modificá los datos y guardá los cambios.
      La cotización existente no se perderá.
    </p>


    <div class="form-grid">


      <div>

        <label>
          Cliente
        </label>

        <input
          id="editClient"
          type="text"
        >

      </div>


      <div>

        <label>
          Oportunidad / Proyecto
        </label>

        <input
          id="editProject"
          type="text"
        >

      </div>


      <div>

        <label>
          Solución
        </label>

        <input
          id="editSolution"
          type="text"
        >

      </div>


      <div>

        <label>
          Estado
        </label>

        <select id="editStatus">

          <option value="analysis">
            🟡 En análisis
          </option>

          <option value="quote">
            🔵 Cotizando
          </option>

          <option value="proposal">
            🟣 Propuesta
          </option>

          <option value="won">
            🟢 Ganada
          </option>

          <option value="lost">
            🔴 Perdida
          </option>

        </select>

      </div>


      <div>

        <label>
          Usuarios
        </label>

        <input
          id="editUsers"
          type="text"
        >

      </div>


      <div>

        <label>
          Storage
        </label>

        <input
          id="editStorage"
          type="text"
        >

      </div>


      <div>

        <label>
          Documentos
        </label>

        <input
          id="editDocuments"
          type="text"
        >

      </div>


      <div>

        <label>
          Workflows
        </label>

        <input
          id="editWorkflows"
          type="text"
        >

      </div>


      <div>

        <label>
          OCR
        </label>

        <select id="editOcr">

          <option value="No definido">
            No definido
          </option>

          <option value="No requerido">
            No requerido
          </option>

          <option value="Requerido">
            Requerido
          </option>

        </select>

      </div>


      <div>

        <label>
          Firmas
        </label>

        <select id="editSignatures">

          <option value="No definido">
            No definido
          </option>

          <option value="No requerido">
            No requerido
          </option>

          <option value="Requerido">
            Requerido
          </option>

        </select>

      </div>


      <div>

        <label>
          Infraestructura
        </label>

        <input
          id="editInfrastructure"
          type="text"
        >

      </div>


      <div>

        <label>
          Plazo
        </label>

        <input
          id="editDeadline"
          type="text"
        >

      </div>


      <div class="full">

        <label>
          Objetivo
        </label>

        <textarea
          id="editObjective"
        ></textarea>

      </div>


      <div class="full">

        <label>
          Requerimientos
        </label>

        <textarea
          id="editRequirements"
        ></textarea>

      </div>


      <div class="full">

        <label>
          Riesgos
        </label>

        <textarea
          id="editRisks"
        ></textarea>

      </div>


      <div class="full">

        <label>
          Notas
        </label>

        <textarea
          id="editNotes"
        ></textarea>

      </div>

    </div>


    <div class="modal-buttons">

      <button
        class="green"
        onclick="saveEditedOpportunity()"
      >
        💾 Guardar cambios
      </button>


      <button
        class="secondary"
        onclick="closeEditModal()"
      >
        Cancelar
      </button>

    </div>

  </div>

</div>


<script>


/* ==========================================
   DATOS
========================================== */

function getOpportunities() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "preventa_opportunities"
      )
    ) || [];

  }

  catch(error) {

    console.error(error);

    return [];

  }

}


/* ==========================================
   GUARDAR
========================================== */

function saveOpportunities(
  opportunities
) {

  localStorage.setItem(
    "preventa_opportunities",
    JSON.stringify(
      opportunities
    )
  );

}


/* ==========================================
   ESTADOS
========================================== */

function getStatusName(
  status
) {

  const names = {

    analysis:
      "🟡 En análisis",

    quote:
      "🔵 Cotizando",

    proposal:
      "🟣 Propuesta",

    won:
      "🟢 Ganada",

    lost:
      "🔴 Perdida"

  };


  return (
    names[status] ||
    "Sin estado"
  );

}


/* ==========================================
   ESTADO CSS
========================================== */

function getStatusClass(
  status
) {

  const classes = {

    analysis:
      "analysis",

    quote:
      "quote",

    proposal:
      "proposal",

    won:
      "won",

    lost:
      "lost"

  };


  return (
    classes[status] ||
    "analysis"
  );

}


/* ==========================================
   RESUMEN
========================================== */

function updateSummary(
  opportunities
) {

  document.getElementById(
    "totalOpportunities"
  ).textContent =
    opportunities.length;


  document.getElementById(
    "analysisCount"
  ).textContent =
    opportunities.filter(
      item =>
        item.status === "analysis"
    ).length;


  document.getElementById(
    "quoteCount"
  ).textContent =
    opportunities.filter(
      item =>
        !!item.quote
    ).length;


  document.getElementById(
    "wonCount"
  ).textContent =
    opportunities.filter(
      item =>
        item.status === "won"
    ).length;

}


/* ==========================================
   RENDER
========================================== */

function renderRepository() {

  const opportunities =
    getOpportunities();


  updateSummary(
    opportunities
  );


  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


  const container =
    document.getElementById(
      "opportunities"
    );


  container.innerHTML = "";


  const filtered =
    opportunities.filter(
      function(opportunity) {

        const texto =

          String(
            opportunity.client ||
            ""
          ) +

          " " +

          String(
            opportunity.project ||
            ""
          ) +

          " " +

          String(
            opportunity.solution ||
            ""
          );


        return texto
          .toLowerCase()
          .includes(
            search
          );

      }
    );


  if (
    filtered.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        <div style="font-size:45px;">
          🗂️
        </div>

        <h3>
          No hay oportunidades
        </h3>

        <p>
          Las oportunidades que crees aparecerán automáticamente acá.
        </p>

      </div>

    `;

    return;

  }


  filtered.forEach(
    function(opportunity) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "opportunity";


      const quote =
        opportunity.quote;


      card.innerHTML = `

        <div class="opportunity-header">

          <div class="opportunity-title">

            <h3>
              ${escapeHTML(
                opportunity.project ||
                "Sin nombre"
              )}
            </h3>

            <p>
              👤 Cliente:
              ${escapeHTML(
                opportunity.client ||
                "Sin definir"
              )}
            </p>

            <p>
              🧩 Solución:
              ${escapeHTML(
                opportunity.solution ||
                "Por definir"
              )}
            </p>

            <span
              class="status ${getStatusClass(
                opportunity.status
              )}"
            >
              ${getStatusName(
                opportunity.status
              )}
            </span>

          </div>

        </div>


        <div class="data-grid">

          ${dataCard(
            "👥 Usuarios",
            opportunity.users
          )}

          ${dataCard(
            "💾 Storage",
            opportunity.storage
          )}

          ${dataCard(
            "📑 Documentos",
            opportunity.documents
          )}

          ${dataCard(
            "🔄 Workflows",
            opportunity.workflows
          )}

          ${dataCard(
            "🔎 OCR",
            opportunity.ocr
          )}

          ${dataCard(
            "✍️ Firmas",
            opportunity.signatures
          )}

          ${dataCard(
            "🏗️ Infraestructura",
            opportunity.infrastructure
          )}

          ${dataCard(
            "📅 Plazo",
            opportunity.deadline
          )}

        </div>


        ${
          quote

            ? `

              <div class="quote-section">

                <div class="quote-title">
                  💰 Cotización guardada
                </div>

                <div class="quote-grid">

                  ${quoteCard(
                    "SETUP",
                    quote.totalSetup
                  )}

                  ${quoteCard(
                    "MENSUAL",
                    quote.totalMonthly
                  )}

                  ${quoteCard(
                    "PRIMER AÑO",
                    quote.totalYear
                  )}

                </div>

              </div>

            `

            : `

              <div class="no-quote">
                ⚠️ Esta oportunidad todavía no tiene una cotización guardada.
              </div>

            `
        }


        <div class="actions">

          <button
            class="edit"
            onclick="editOpportunity('${escapeAttribute(
              opportunity.id
            )}')"
          >
            ✏️ Editar
          </button>


          <button
            onclick="toggleDetail(this)"
          >
            👁️ Ver resumen
          </button>


          <button
            class="green"
            onclick="openQuote('${escapeAttribute(
              opportunity.id
            )}')"
          >
            💰 ${
              quote
                ? "Editar cotización"
                : "Cotizar"
            }
          </button>


          ${
            opportunity.status !== "won"

              ? `

                <button
                  class="green"
                  onclick="markWon('${escapeAttribute(
                    opportunity.id
                  )}')"
                >
                  🟢 Ganada
                </button>

              `

              : ""

          }


          ${
            opportunity.status !== "lost"

              ? `

                <button
                  class="red"
                  onclick="markLost('${escapeAttribute(
                    opportunity.id
                  )}')"
                >
                  🔴 Perdida
                </button>

              `

              : ""

          }


          <button
            class="secondary"
            onclick="deleteOpportunity('${escapeAttribute(
              opportunity.id
            )}')"
          >
            🗑️ Eliminar
          </button>

        </div>


        <div class="detail">

          <div class="detail-section">

            <h4>
              🎯 Objetivo
            </h4>

            <div class="detail-text">
              ${escapeHTML(
                opportunity.objective ||
                "No hay objetivo cargado."
              )}
            </div>

          </div>


          <div class="detail-section">

            <h4>
              🧩 Requerimientos
            </h4>

            <div class="detail-text">
              ${escapeHTML(
                opportunity.requirements ||
                "No hay requerimientos cargados."
              )}
            </div>

          </div>


          <div class="detail-section">

            <h4>
              ⚠️ Riesgos
            </h4>

            <div class="detail-text">
              ${escapeHTML(
                opportunity.risks ||
                "No hay riesgos cargados."
              )}
            </div>

          </div>


          <div class="detail-section">

            <h4>
              📝 Notas
            </h4>

            <div class="detail-text">
              ${escapeHTML(
                opportunity.notes ||
                "Sin notas."
              )}
            </div>

          </div>


          <div class="detail-section">

            <h4>
              📄 Documento de origen
            </h4>

            <div class="detail-text">
              ${escapeHTML(
                opportunity.sourceDocument ||
                "No asociado"
              )}
            </div>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   DATA CARD
========================================== */

function dataCard(
  label,
  value
) {

  return `

    <div class="data-card">

      <div class="data-label">
        ${escapeHTML(
          label
        )}
      </div>

      <div class="data-value">
        ${escapeHTML(
          String(
            value ||
            "No definido"
          )
        )}
      </div>

    </div>

  `;

}


/* ==========================================
   QUOTE CARD
========================================== */

function quoteCard(
  label,
  value
) {

  return `

    <div class="quote-card">

      <div class="quote-label">
        ${escapeHTML(
          label
        )}
      </div>

      <div class="quote-value">
        ${escapeHTML(
          String(
            value ||
            "USD 0,00"
          )
        )}
      </div>

    </div>

  `;

}


/* ==========================================
   EDITAR
========================================== */

function editOpportunity(
  id
) {

  const opportunities =
    getOpportunities();


  const opportunity =
    opportunities.find(
      item =>
        String(
          item.id
        ) ===
        String(id)
    );


  if (!opportunity) {

    alert(
      "No encontré la oportunidad."
    );

    return;

  }


  document.getElementById(
    "editModal"
  ).dataset.id =
    opportunity.id;


  setValue(
    "editClient",
    opportunity.client
  );

  setValue(
    "editProject",
    opportunity.project
  );

  setValue(
    "editSolution",
    opportunity.solution
  );

  setValue(
    "editStatus",
    opportunity.status
  );

  setValue(
    "editUsers",
    opportunity.users
  );

  setValue(
    "editStorage",
    opportunity.storage
  );

  setValue(
    "editDocuments",
    opportunity.documents
  );

  setValue(
    "editWorkflows",
    opportunity.workflows
  );

  setValue(
    "editOcr",
    opportunity.ocr ||
    "No definido"
  );

  setValue(
    "editSignatures",
    opportunity.signatures ||
    "No definido"
  );

  setValue(
    "editInfrastructure",
    opportunity.infrastructure
  );

  setValue(
    "editDeadline",
    opportunity.deadline
  );

  setValue(
    "editObjective",
    opportunity.objective
  );

  setValue(
    "editRequirements",
    opportunity.requirements
  );

  setValue(
    "editRisks",
    opportunity.risks
  );

  setValue(
    "editNotes",
    opportunity.notes
  );


  document.getElementById(
    "editModal"
  ).style.display =
    "flex";

}


/* ==========================================
   GUARDAR EDICION
========================================== */

function saveEditedOpportunity() {

  const modal =
    document.getElementById(
      "editModal"
    );


  const id =
    modal.dataset.id;


  const opportunities =
    getOpportunities();


  const index =
    opportunities.findIndex(
      item =>
        String(
          item.id
        ) ===
        String(id)
    );


  if (
    index === -1
  ) {

    alert(
      "No encontré la oportunidad."
    );

    return;

  }


  const anterior =
    opportunities[index];


  const client =
    getValue(
      "editClient"
    );


  const project =
    getValue(
      "editProject"
    );


  if (
    !client ||
    !project
  ) {

    alert(
      "Completá Cliente y Oportunidad / Proyecto."
    );

    return;

  }


  /*
    Actualizamos solamente
    los datos editables.

    La cotización queda intacta.
  */

  opportunities[index] = {

    ...anterior,

    client:
      client,

    project:
      project,

    solution:
      getValue(
        "editSolution"
      ) ||
      "Por definir",

    status:
      getValue(
        "editStatus"
      ) ||
      "analysis",

    users:
      getValue(
        "editUsers"
      ),

    storage:
      getValue(
        "editStorage"
      ),

    documents:
      getValue(
        "editDocuments"
      ),

    workflows:
      getValue(
        "editWorkflows"
      ),

    ocr:
      getValue(
        "editOcr"
      ),

    signatures:
      getValue(
        "editSignatures"
      ),

    infrastructure:
      getValue(
        "editInfrastructure"
      ),

    deadline:
      getValue(
        "editDeadline"
      ),

    objective:
      getValue(
        "editObjective"
      ),

    requirements:
      getValue(
        "editRequirements"
      ),

    risks:
      getValue(
        "editRisks"
      ),

    notes:
      getValue(
        "editNotes"
      ),

    updatedAt:
      new Date().toISOString()

  };


  saveOpportunities(
    opportunities
  );


  /*
    Actualizar oportunidad actual
  */

  const current =
    JSON.parse(
      localStorage.getItem(
        "preventa_current_opportunity"
      ) ||
      "null"
    );


  if (
    current &&
    String(
      current.id
    ) ===
    String(id)
  ) {

    localStorage.setItem(
      "preventa_current_opportunity",
      JSON.stringify(
        opportunities[index]
      )
    );

  }


  closeEditModal();


  renderRepository();

}


/* ==========================================
   GANADA
========================================== */

function markWon(
  id
) {

  changeStatus(
    id,
    "won"
  );

}


/* ==========================================
   PERDIDA
========================================== */

function markLost(
  id
) {

  changeStatus(
    id,
    "lost"
  );

}


/* ==========================================
   CAMBIAR ESTADO
========================================== */

function changeStatus(
  id,
  status
) {

  const opportunities =
    getOpportunities();


  const index =
    opportunities.findIndex(
      item =>
        String(
          item.id
        ) ===
        String(id)
    );


  if (
    index === -1
  ) {

    alert(
      "No encontré la oportunidad."
    );

    return;

  }


  const nombre =
    opportunities[index].project ||
    "esta oportunidad";


  const mensaje =
    status === "won"

      ? "¿Querés marcar '" +
        nombre +
        "' como GANADA?"

      : "¿Querés marcar '" +
        nombre +
        "' como PERDIDA?";


  if (
    !confirm(
      mensaje
    )
  ) {

    return;

  }


  opportunities[index].status =
    status;


  opportunities[index].updatedAt =
    new Date().toISOString();


  saveOpportunities(
    opportunities
  );


  renderRepository();

}


/* ==========================================
   ELIMINAR
========================================== */

function deleteOpportunity(
  id
) {

  const opportunities =
    getOpportunities();


  const opportunity =
    opportunities.find(
      item =>
        String(
          item.id
        ) ===
        String(id)
    );


  if (!opportunity) {

    return;

  }


  if (
    !confirm(
      "¿Querés eliminar '" +
      (
        opportunity.project ||
        "esta oportunidad"
      ) +
      "'?"
    )
  ) {

    return;

  }


  const nuevas =
    opportunities.filter(
      item =>
        String(
          item.id
        ) !==
        String(id)
    );


  saveOpportunities(
    nuevas
  );


  const current =
    JSON.parse(
      localStorage.getItem(
        "preventa_current_opportunity"
      ) ||
      "null"
    );


  if (
    current &&
    String(
      current.id
    ) ===
    String(id)
  ) {

    localStorage.removeItem(
      "preventa_current_opportunity"
    );

  }


  renderRepository();

}


/* ==========================================
   COTIZADOR
========================================== */

function openQuote(
  id
) {

  const opportunities =
    getOpportunities();


  const opportunity =
    opportunities.find(
      item =>
        String(
          item.id
        ) ===
        String(id)
    );


  if (!opportunity) {

    alert(
      "No encontré la oportunidad."
    );

    return;

  }


  localStorage.setItem(
    "preventa_current_opportunity",
    JSON.stringify(
      opportunity
    )
  );


  window.location.href =
    "cotizador.html";

}


/* ==========================================
   DETALLE
========================================== */

function toggleDetail(
  button
) {

  const card =
    button.closest(
      ".opportunity"
    );


  const detail =
    card.querySelector(
      ".detail"
    );


  if (
    detail.style.display ===
    "block"
  ) {

    detail.style.display =
      "none";

    button.textContent =
      "👁️ Ver resumen";

  }

  else {

    detail.style.display =
      "block";

    button.textContent =
      "🔼 Ocultar resumen";

  }

}


/* ==========================================
   MODAL
========================================== */

function closeEditModal() {

  document.getElementById(
    "editModal"
  ).style.display =
    "none";

}


function getValue(
  id
) {

  return document
    .getElementById(
      id
    )
    .value
    .trim();

}


function setValue(
  id,
  value
) {

  document.getElementById(
    id
  ).value =
    value ||
    "";

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(
  value
) {

  return String(
    value ||
    ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(
  value
) {

  return String(
    value ||
    ""
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* ==========================================
   INICIO
========================================== */

renderRepository();

</script>
