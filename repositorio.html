<script>


/* =====================================================
   CONFIGURACION
===================================================== */

const DB_NAME =
  "preventa_ia_biblioteca";


const DB_VERSION =
  2;


const FINAL_STORE =
  "finalProposals";


let db =
  null;


/* =====================================================
   OPORTUNIDADES
===================================================== */

function getOpportunities() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "preventa_opportunities"
      )
    ) || [];

  }

  catch(error) {

    console.error(
      error
    );

    return [];

  }

}


/* =====================================================
   BASE DE DATOS
===================================================== */

function openDatabase() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const database =
            event.target.result;


          if (
            !database.objectStoreNames.contains(
              FINAL_STORE
            )
          ) {

            const store =
              database.createObjectStore(
                FINAL_STORE,
                {
                  keyPath: "id"
                }
              );


            store.createIndex(
              "opportunityId",
              "opportunityId",
              {
                unique: false
              }
            );


            store.createIndex(
              "createdAt",
              "createdAt",
              {
                unique: false
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          db =
            event.target.result;


          resolve(
            db
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   OBTENER PROPUESTA FINAL
===================================================== */

function getFinalProposal(
  opportunityId
) {

  return new Promise(
    function(resolve, reject) {

      if (!db) {

        resolve(null);

        return;

      }


      if (
        !db.objectStoreNames.contains(
          FINAL_STORE
        )
      ) {

        resolve(null);

        return;

      }


      const transaction =
        db.transaction(
          FINAL_STORE,
          "readonly"
        );


      const store =
        transaction.objectStore(
          FINAL_STORE
        );


      const index =
        store.index(
          "opportunityId"
        );


      const request =
        index.getAll(
          String(
            opportunityId
          )
        );


      request.onsuccess =
        function() {

          const results =
            request.result || [];


          results.sort(
            function(a, b) {

              return (
                new Date(
                  b.createdAt || 0
                ) -
                new Date(
                  a.createdAt || 0
                )
              );

            }
          );


          resolve(
            results[0] ||
            null
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   ESTADO
===================================================== */

function getStatusName(
  status
) {

  const names = {

    analysis:
      "🟡 En análisis",

    quote:
      "🔵 Cotizando",

    proposal:
      "🟣 Propuesta",

    won:
      "🟢 Ganada",

    lost:
      "🔴 Perdida"

  };


  return (
    names[status] ||
    status ||
    "Sin estado"
  );

}


/* =====================================================
   RESUMEN
===================================================== */

function updateSummary(
  opportunities
) {

  document.getElementById(
    "totalOpportunities"
  ).textContent =
    opportunities.length;


  document.getElementById(
    "analysisCount"
  ).textContent =
    opportunities.filter(
      x =>
        x.status ===
        "analysis"
    ).length;


  document.getElementById(
    "quoteCount"
  ).textContent =
    opportunities.filter(
      x =>
        !!x.quote
    ).length;


  document.getElementById(
    "wonCount"
  ).textContent =
    opportunities.filter(
      x =>
        x.status ===
        "won"
    ).length;

}


/* =====================================================
   RENDER
===================================================== */

async function renderRepository() {

  const opportunities =
    getOpportunities();


  updateSummary(
    opportunities
  );


  const search =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();


  const container =
    document.getElementById(
      "opportunities"
    );


  container.innerHTML =
    "";


  const filtered =
    opportunities.filter(
      function(opportunity) {

        const texto =
          (
            String(
              opportunity.client ||
              ""
            ) +
            " " +
            String(
              opportunity.project ||
              ""
            ) +
            " " +
            String(
              opportunity.solution ||
              ""
            )
          )
          .toLowerCase();


        return texto.includes(
          search
        );

      }
    );


  if (
    filtered.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        <div style="font-size:45px;">
          🗂️
        </div>

        <h3>
          No hay oportunidades en el repositorio
        </h3>

        <p>
          Las oportunidades que crees aparecerán
          automáticamente acá.
        </p>

      </div>

    `;

    return;

  }


  for (
    const opportunity of filtered
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "opportunity";


    const quote =
      opportunity.quote;


    let finalProposal =
      null;


    try {

      finalProposal =
        await getFinalProposal(
          opportunity.id
        );

    }

    catch(error) {

      console.error(
        "Error leyendo propuesta:",
        error
      );

    }


    card.innerHTML = `

      <div class="opportunity-header">

        <div class="opportunity-title">

          <h3>
            ${escapeHTML(
              opportunity.project ||
              "Sin nombre"
            )}
          </h3>


          <p>
            👤 Cliente:
            ${escapeHTML(
              opportunity.client ||
              "Sin cliente"
            )}
          </p>


          <p>
            🧩 Solución:
            ${escapeHTML(
              opportunity.solution ||
              opportunity.product ||
              "Por definir"
            )}
          </p>


          <span
            class="status ${
              opportunity.status ||
              "analysis"
            }"
          >
            ${getStatusName(
              opportunity.status
            )}
          </span>

        </div>

      </div>


      <!-- DATOS -->

      <div class="data-grid">

        ${dataCard(
          "👥 Usuarios",
          opportunity.users
        )}

        ${dataCard(
          "💾 Storage",
          opportunity.storage
        )}

        ${dataCard(
          "📑 Documentos",
          opportunity.documents
        )}

        ${dataCard(
          "🔄 Workflows",
          opportunity.workflows
        )}

        ${dataCard(
          "🔎 OCR",
          opportunity.ocr
        )}

        ${dataCard(
          "✍️ Firmas",
          opportunity.signatures
        )}

        ${dataCard(
          "🏗️ Infraestructura",
          opportunity.infrastructure
        )}

        ${dataCard(
          "📅 Plazo",
          opportunity.deadline
        )}

      </div>


      <!-- COTIZACION -->

      ${
        quote

          ? `

            <div class="quote-section">

              <div class="quote-title">
                💰 Cotización asociada
              </div>

              <div class="quote-grid">

                ${quoteCard(
                  "SETUP",
                  quote.totalSetup
                )}

                ${quoteCard(
                  "MENSUAL",
                  quote.totalMonthly
                )}

                ${quoteCard(
                  "PRIMER AÑO",
                  quote.totalYear
                )}

              </div>

            </div>

          `

          : `

            <div class="no-quote">

              ⚠️ Esta oportunidad todavía no tiene
              una cotización guardada.

            </div>

          `
      }


      <!-- PROPUESTA FINAL -->

      ${
        finalProposal

          ? `

            <div class="proposal-section">

              <div class="proposal-title">

                📄 Propuesta final

              </div>


              <div class="proposal-file">

                <strong>
                  ${escapeHTML(
                    finalProposal.fileName ||
                    "Propuesta final"
                  )}
                </strong>

                <br>

                Producto:
                ${escapeHTML(
                  finalProposal.product ||
                  opportunity.product ||
                  opportunity.solution ||
                  "Sin especificar"
                )}

                <br>

                Generada:
                ${formatDate(
                  finalProposal.createdAt
                )}

              </div>


              <div class="actions">

                <button
                  class="purple"
                  onclick="previewProposal('${escapeAttribute(
                    opportunity.id
                  )}')"
                >
                  👁️ Previsualizar
                </button>


                <button
                  class="green"
                  onclick="downloadProposal('${escapeAttribute(
                    opportunity.id
                  )}')"
                >
                  ⬇️ Descargar Word
                </button>

              </div>

            </div>

          `

          : `

            <div class="no-quote">

              📄 Todavía no hay una propuesta final
              generada para esta oportunidad.

            </div>

          `
      }


      <!-- ACCIONES -->

      <div class="actions">

        <button
          onclick="toggleDetail(this)"
        >
          👁️ Ver resumen
        </button>


        <button
          class="secondary"
          onclick="openQuote('${escapeAttribute(
            opportunity.id
          )}')"
        >
          💰 ${
            quote
              ? "Editar cotización"
              : "Ir al cotizador"
          }
        </button>

      </div>


      <!-- DETALLE -->

      <div class="detail">


        <div class="detail-section">

          <h4>
            🎯 Objetivo
          </h4>

          <div class="detail-text">

            ${escapeHTML(
              opportunity.objective ||
              "No hay objetivo cargado."
            )}

          </div>

        </div>


        <div class="detail-section">

          <h4>
            🧩 Requerimientos
          </h4>

          <div class="detail-text">

            ${escapeHTML(
              opportunity.requirements ||
              "No hay requerimientos cargados."
            )}

          </div>

        </div>


        <div class="detail-section">

          <h4>
            ⚠️ Riesgos
          </h4>

          <div class="detail-text">

            ${escapeHTML(
              opportunity.risks ||
              "No hay riesgos cargados."
            )}

          </div>

        </div>


        <div class="detail-section">

          <h4>
            📝 Notas
          </h4>

          <div class="detail-text">

            ${escapeHTML(
              opportunity.notes ||
              "Sin notas."
            )}

          </div>

        </div>


      </div>

    `;


    container.appendChild(
      card
    );

  }

}


/* =====================================================
   DATA CARD
===================================================== */

function dataCard(
  label,
  value
) {

  return `

    <div class="data-card">

      <div class="data-label">

        ${escapeHTML(
          label
        )}

      </div>

      <div class="data-value">

        ${escapeHTML(
          String(
            value ||
            "No definido"
          )
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   QUOTE CARD
===================================================== */

function quoteCard(
  label,
  value
) {

  return `

    <div class="quote-card">

      <div class="quote-label">

        ${escapeHTML(
          label
        )}

      </div>

      <div class="quote-value">

        ${escapeHTML(
          formatMoney(
            value
          )
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   RESUMEN
===================================================== */

function toggleDetail(
  button
) {

  const card =

async function previewProposal(
  opportunityId
) {

  const proposal =
    await getFinalProposal(
      opportunityId
    );


  if (!proposal) {

    alert(
      "No se encontró la propuesta final."
    );

    return;

  }


  if (
    typeof mammoth ===
    "undefined"
  ) {

    alert(
      "No se pudo cargar el visor de Word."
    );

    return;

  }


  const modal =
    document.getElementById(
      "previewModal"
    );


  const title =
    document.getElementById(
      "previewTitle"
    );


  const preview =
    document.getElementById(
      "preview"
    );


  title.textContent =
    "📄 " +
    (
      proposal.fileName ||
      "Propuesta final"
    );


  preview.innerHTML = `

    <div class="document-page">

      ⏳ Cargando propuesta...

    </div>

  `;


  modal.style.display =
    "flex";


  try {

    const arrayBuffer =
      await proposal.blob.arrayBuffer();


    const result =
      await mammoth.convertToHtml(
        {
          arrayBuffer:
            arrayBuffer
        }
      );


    preview.innerHTML =

      "<div class='document-page'>" +

        (
          result.value ||
          "<p>No se pudo mostrar el contenido.</p>"
        ) +

      "</div>";

  }

  catch(error) {

    console.error(
      error
    );


    preview.innerHTML = `

      <div class="document-page">

        <h3>
          ⚠️ No se pudo previsualizar
        </h3>

        <p>
          El archivo está guardado correctamente,
          pero no se pudo mostrar su contenido
          en el visor.
        </p>

        <p>
          Podés descargar el Word desde
          la oportunidad.
        </p>

      </div>

    `;

  }

}

===================================================== */

async function downloadProposal(
  opportunityId
) {

  const proposal =
    await getFinalProposal(
      opportunityId
    );


  if (!proposal) {

    alert(
      "No se encontró la propuesta final."
    );

    return;

  }


  const url =
    URL.createObjectURL(
      proposal.blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    proposal.fileName ||
    "Propuesta_Preventa_IA.docx";


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}

function formatDate(
  value
) {

  if (!value) {

    return "Sin fecha";

  }


  try {

    return new Date(
      value
    ).toLocaleString(
      "es-AR"
    );

  }

  catch(error) {

    return "Sin fecha";

  }

}


/* =====================================================
   DINERO
===================================================== */

function formatMoney(
  value
) {

  if (
    typeof value ===
    "string"
  ) {

    return value;

  }


  return (
    "USD " +
    Number(
      value || 0
    ).toLocaleString(
      "es-AR",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    )
  );

}


/* =====================================================
   SEGURIDAD
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ||
    ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(
  value
) {

  return String(
    value ||
    ""
  )
  .replace(
    /'/g,
    "\\'"
  );

}
