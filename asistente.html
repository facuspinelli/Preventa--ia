<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistente IA | PREVENTA IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .chat {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .messages {
      min-height: 350px;
      padding: 10px;
      margin-bottom: 20px;
    }

    .message {
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      max-width: 75%;
      line-height: 1.5;
    }

    .ia {
      background: #eef2ff;
      margin-right: auto;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 55px;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 25px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #374151;
    }

    .tip {
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 PREVENTA IA</h1>
    <a href="index.html" class="back">← Volver al inicio</a>
  </header>

  <main class="container">

    <div class="welcome">
      <h2>Asistente IA</h2>
      <p>
        Tu asistente para resolver tareas de Preventa.
      </p>
    </div>

    <div class="chat">

      <div class="messages" id="messages">

        <div class="message ia">
          👋 Hola. Soy tu asistente de Preventa IA.
          <br><br>
          ¿En qué puedo ayudarte?
        </div>

      </div>

      <div class="input-area">

        <textarea
          id="question"
          placeholder="Escribí tu consulta..."
        ></textarea>

        <button onclick="sendMessage()">
          Enviar
        </button>

      </div>

      <div class="tip">
        💡 Probá preguntarme algo como:
        "¿Qué preguntas debería hacerle a un cliente durante un relevamiento?"
      </div>

    </div>

  </main>

  <script>

    function sendMessage() {

      const input = document.getElementById("question");
      const messages = document.getElementById("messages");

      const question = input.value.trim();

      if (question === "") {
        return;
      }

      // Mostrar mensaje del usuario

      const userMessage = document.createElement("div");

      userMessage.className = "message user";
      userMessage.textContent = question;

      messages.appendChild(userMessage);

      // Limpiar campo

      input.value = "";

      // Respuesta temporal de la IA

      // Buscar información en la base de conocimiento

setTimeout(async function() {

  const iaMessage = document.createElement("div");

  iaMessage.className = "message ia";

  try {

    const response = await fetch("conocimiento.json");

    if (!response.ok) {
      throw new Error("No se pudo cargar la base de conocimiento");
    }

    const conocimiento = await response.json();

    const q = question.toLowerCase();

    let resultados = [];

    // Buscar coincidencias dentro de todo el conocimiento

    function buscar(objeto, ruta = "") {

      if (typeof objeto === "string") {

        const texto = objeto.toLowerCase();

        const palabras = q
          .split(/\s+/)
          .filter(palabra => palabra.length > 3);

        let coincidencias = 0;

        palabras.forEach(palabra => {

          if (texto.includes(palabra)) {
            coincidencias++;
          }

        });

        if (coincidencias > 0) {

          resultados.push({
            texto: objeto,
            coincidencias: coincidencias,
            ruta: ruta
          });

        }

      } else if (Array.isArray(objeto)) {

        objeto.forEach((item, index) => {
          buscar(item, ruta);
        });

      } else if (typeof objeto === "object" && objeto !== null) {

        Object.keys(objeto).forEach(clave => {

          buscar(
            objeto[clave],
            ruta ? ruta + " → " + clave : clave
          );

        });

      }

    }

    buscar(conocimiento);

    // Ordenar resultados por cantidad de coincidencias

    resultados.sort(function(a, b) {
      return b.coincidencias - a.coincidencias;
    });

    // Evitar respuestas demasiado largas

    resultados = resultados.slice(0, 8);

    if (resultados.length === 0) {

      iaMessage.textContent =
        "No encontré información específica sobre esa consulta en mi base de conocimiento. 🤔\n\n" +
        "Probá preguntarme sobre Thuban, Captika, Edatalia, Perfil Digital, " +
        "Onboarding Addoc, Firmas Addoc, Visualizador Addoc, Islas, " +
        "migraciones, relevamientos o propuestas técnicas.";

    } else {

      let respuesta =
        "Encontré esta información relacionada con tu consulta:\n\n";

      resultados.forEach(function(resultado, index) {

        respuesta +=
          "• " + resultado.texto + "\n";

      });

      respuesta +=
        "\n💡 Si necesitás una respuesta más específica, " +
        "podés agregar datos del cliente, usuarios, documentos, " +
        "volumen, workflows, integraciones o plazos.";

      iaMessage.textContent = respuesta;

    }

  } catch (error) {

    iaMessage.textContent =
      "⚠️ No pude acceder a mi base de conocimiento. " +
      "Verificá que el archivo conocimiento.json esté publicado correctamente.";

    console.error(error);

  }

  messages.appendChild(iaMessage);

  messages.scrollTop = messages.scrollHeight;

}, 500);

    }

  </script>

</body>
</html>
