<!-- PDF.js -->
<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


let archivoActual = null;
let textoDocumento = "";
let paginasDocumento = 0;
let ultimoAnalisis = null;


/* =========================================================
   UTILIDADES
========================================================= */

function limpiarComillas(texto) {

    let resultado = String(texto || "").trim();

    resultado = resultado.replace(
        /^[\s"'“”„‟«»]+/,
        ""
    );

    resultado = resultado.replace(
        /[\s"'“”„‟«»]+$/,
        ""
    );

    return resultado.trim();

}


function limpiarTexto(texto) {

    return String(texto || "")
        .replace(/\r/g, " ")
        .replace(/\n+/g, " ")
        .replace(/\s{2,}/g, " ")
        .trim();

}


function escaparHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function normalizar(texto) {

    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

}


function mostrarStatus(texto) {

    const status = document.getElementById("status");

    status.textContent = texto;
    status.style.display = "block";

}


/* =========================================================
   EJEMPLOS
========================================================= */

function usarEjemplo(texto) {

    document.getElementById("consulta").value = texto;

}

window.usarEjemplo = usarEjemplo;


/* =========================================================
   CARGA DEL ARCHIVO
========================================================= */

document.getElementById("archivo").addEventListener(
    "change",
    async function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        archivoActual = file;
        ultimoAnalisis = null;

        const preview = document.getElementById("preview");
        const pdfPreview = document.getElementById("pdfPreview");
        const txtPreview = document.getElementById("txtPreview");

        preview.style.display = "block";

        if (
            file.type === "application/pdf" ||
            file.name.toLowerCase().endsWith(".pdf")
        ) {

            pdfPreview.style.display = "block";
            txtPreview.style.display = "none";

            pdfPreview.src = URL.createObjectURL(file);

        } else {

            pdfPreview.style.display = "none";
            txtPreview.style.display = "block";

            const texto = await file.text();

            textoDocumento = texto;

            txtPreview.textContent = texto;

        }

        mostrarStatus(
            "📄 Documento cargado correctamente. Ahora podés indicar qué querés buscar."
        );

    }
);


/* =========================================================
   EXTRAER TEXTO NATIVO DE UNA PÁGINA
========================================================= */

async function extraerTextoNativo(pagina) {

    const contenido = await pagina.getTextContent();

    return limpiarTexto(
        contenido.items
            .map(item => item.str || "")
            .join(" ")
    );

}


/* =========================================================
   OCR DE UNA PÁGINA
========================================================= */

async function ejecutarOCR(pagina, numeroPagina) {

    if (typeof Tesseract === "undefined") {

        console.warn(
            "Tesseract no está disponible."
        );

        return "";

    }

    try {

        const viewport = pagina.getViewport({
            scale: 1.5
        });

        const canvas = document.createElement("canvas");

        const contexto = canvas.getContext("2d", {
            willReadFrequently: true
        });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await pagina.render({
            canvasContext: contexto,
            viewport: viewport
        }).promise;

        mostrarStatus(
            `🔍 OCR: procesando página ${numeroPagina}...`
        );

        const resultado = await Tesseract.recognize(
            canvas,
            "spa",
            {
                logger: function(info) {

                    if (
                        info.status === "recognizing text" &&
                        typeof info.progress === "number"
                    ) {

                        const porcentaje =
                            Math.round(
                                info.progress * 100
                            );

                        mostrarStatus(
                            `🔍 OCR: página ${numeroPagina} — ${porcentaje}%`
                        );

                    }

                }
            }
        );

        return limpiarTexto(
            resultado.data.text || ""
        );

    } catch (error) {

        console.error(
            `Error OCR página ${numeroPagina}:`,
            error
        );

        return "";

    }

}


/* =========================================================
   EXTRAER PDF
   TODOS LOS PDF PASAN POR OCR
========================================================= */

async function extraerPDF(file) {

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: buffer
    }).promise;

    paginasDocumento = pdf.numPages;

    const paginas = [];

    for (
        let numero = 1;
        numero <= pdf.numPages;
        numero++
    ) {

        mostrarStatus(
            `📄 Procesando página ${numero} de ${pdf.numPages}...`
        );

        const pagina =
            await pdf.getPage(numero);

        /* -----------------------------------------
           1. TEXTO NATIVO
        ----------------------------------------- */

        const textoNativo =
            await extraerTextoNativo(
                pagina
            );


        /* -----------------------------------------
           2. OCR
           SE EJECUTA SIEMPRE
        ----------------------------------------- */

        const textoOCR =
            await ejecutarOCR(
                pagina,
                numero
            );


        /* -----------------------------------------
           3. COMBINAR RESULTADOS
        ----------------------------------------- */

        let textoFinal = "";

        if (textoNativo) {

            textoFinal +=
                textoNativo;

        }

        if (textoOCR) {

            if (textoFinal) {
                textoFinal += " ";
            }

            textoFinal +=
                textoOCR;

        }


        textoFinal =
            limpiarTexto(textoFinal);


        paginas.push({

            page: numero,

            text: textoFinal,

            nativeText: textoNativo,

            ocrText: textoOCR

        });

    }


    textoDocumento =
        paginas
            .map(p => p.text)
            .join("\n\n");


    return paginas;

}


/* =========================================================
   EXTRAER FRAGMENTO CON CONTEXTO
========================================================= */

function extraerFragmento(texto, patron) {

    const match =
        texto.match(patron);

    if (!match) {
        return "";
    }

    const inicio =
        Math.max(
            0,
            match.index - 100
        );

    const fin =
        Math.min(
            texto.length,
            match.index +
            match[0].length +
            180
        );

    return limpiarComillas(
        limpiarTexto(
            texto.substring(
                inicio,
                fin
            )
        )
    );

}


/* =========================================================
   DETECTAR DATO CONCRETO
========================================================= */

function detectarDato(texto, patrones) {

    for (const patron of patrones) {

        const match =
            texto.match(patron);

        if (
            match &&
            match[1]
        ) {

            return limpiarComillas(
                match[1].trim()
            );

        }

    }

    return "";

}


/* =========================================================
   USUARIOS
========================================================= */

function detectarUsuariosEnPagina(texto) {

    const patrones = [

        /(\d[\d.,]*)\s*(usuarios?\s*(?:concurrentes?)?|users?)/i,

        /(?:cantidad|n[uú]mero|total)\s*(?:de\s*)?usuarios?\s*[:\-]?\s*(\d[\d.,]*)/i,

        /usuarios?\s*[:\-]\s*(\d[\d.,]*)/i,

        /hasta\s*(\d[\d.,]*)\s*usuarios?/i,

        /(\d[\d.,]*)\s*usuarios?\s*concurrentes?/i

    ];

    for (const patron of patrones) {

        const match =
            texto.match(patron);

        if (!match) {
            continue;
        }

        let valor = "";

        if (
            patron.source.startsWith("(?:")
        ) {

            valor =
                match[1];

        } else {

            valor =
                match[1];

        }

        if (valor) {

            return {
                value: limpiarComillas(valor),
                context: extraerFragmento(
                    texto,
                    patron
                )
            };

        }

    }

    return null;

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function detectarCategoriasPorPagina(pagina) {

    const texto =
        pagina.text || "";

    const t =
        normalizar(texto);

    const resultado = {};

    /* -----------------------------------------
       USUARIOS
    ----------------------------------------- */

    const usuarios =
        detectarUsuariosEnPagina(
            texto
        );

    if (usuarios) {

        resultado.users =
            `${usuarios.value} usuarios — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       DOCUMENTOS / VOLUMEN
    ----------------------------------------- */

    const volumen =
        detectarDato(
            texto,
            [

                /(\d[\d.,]*)\s*(documentos|expedientes|legajos)/i,

                /(?:cantidad|total|volumen)\s*(?:de\s*)?(?:documentos|expedientes|legajos)\s*[:\-]?\s*(\d[\d.,]*)/i

            ]
        );

    if (volumen) {

        resultado.volume =
            `${volumen} documentos — Página ${pagina.page}`;

        resultado.documents =
            `${volumen} documentos — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       STORAGE
    ----------------------------------------- */

    const almacenamiento =
        detectarDato(
            texto,
            [

                /(\d[\d.,]*)\s*(gb|tb|mb)\b/i,

                /(?:almacenamiento|storage|capacidad)\s*[:\-]?\s*(\d[\d.,]*\s*(?:gb|tb|mb))/i,

                /(?:almacenamiento|storage|capacidad)[^.;]{0,80}(\d[\d.,]*\s*(?:gb|tb|mb))/i

            ]
        );

    if (almacenamiento) {

        resultado.storage =
            `${almacenamiento} — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       OCR
    ----------------------------------------- */

    const tieneOCR =
        /\bocr\b/i.test(texto) ||
        /reconocimiento[ óo]+ptico de caracteres/i.test(texto) ||
        /reconocimiento de caracteres/i.test(texto);

    if (tieneOCR) {

        const contexto =
            extraerFragmento(
                texto,
                /\bocr\b|reconocimiento[ óo]+ptico de caracteres|reconocimiento de caracteres/i
            );

        resultado.ocr =
            `Sí — Página ${pagina.page}${contexto ? ` — ${contexto}` : ""}`;

    }


    /* -----------------------------------------
       TEXTO COMPLETO
    ----------------------------------------- */

    const tieneFullText =
        /texto completo/i.test(texto) ||
        /full[\s-]*text/i.test(texto) ||
        /búsqueda por texto/i.test(texto) ||
        /busqueda por texto/i.test(texto) ||
        /búsqueda de texto/i.test(texto) ||
        /busqueda de texto/i.test(texto);

    if (tieneFullText) {

        resultado.fulltext =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       WORKFLOWS
    ----------------------------------------- */

    const tieneWorkflow =
        /\bworkflow(s)?\b/i.test(texto) ||
        /flujo[s]? de trabajo/i.test(texto) ||
        /circuito[s]? de aprobaci[oó]n/i.test(texto) ||
        /proceso[s]? de aprobaci[oó]n/i.test(texto);

    if (tieneWorkflow) {

        resultado.workflows =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       FIRMAS
    ----------------------------------------- */

    const tieneFirma =
        /firma digital/i.test(texto) ||
        /firma electrónica/i.test(texto) ||
        /firmas digitales/i.test(texto) ||
        /firmas electrónicas/i.test(texto);

    if (tieneFirma) {

        resultado.signatures =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       INTEGRACIONES
    ----------------------------------------- */

    const tieneIntegracion =
        /\bapi\b/i.test(texto) ||
        /integraci[oó]n/i.test(texto) ||
        /web service/i.test(texto) ||
        /servicio web/i.test(texto);

    if (tieneIntegracion) {

        resultado.integrations =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       INFRAESTRUCTURA
    ----------------------------------------- */

    if (
        /\bon[\s-]*premise\b/i.test(texto) ||
        /\bon[\s-]*premises\b/i.test(texto) ||
        /on premise/i.test(texto)
    ) {

        resultado.infrastructure =
            `On-Premise — Página ${pagina.page}`;

    } else if (
        /\bcloud\b/i.test(texto) ||
        /\bnube\b/i.test(texto)
    ) {

        resultado.infrastructure =
            `Cloud — Página ${pagina.page}`;

    } else if (
        /\bservidor(es)?\b/i.test(texto) ||
        /infraestructura/i.test(texto)
    ) {

        resultado.infrastructure =
            `Se requieren referencias de infraestructura — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       SEGURIDAD
    ----------------------------------------- */

    if (
        /seguridad/i.test(texto) ||
        /autenticación/i.test(texto) ||
        /autorización/i.test(texto) ||
        /\bsso\b/i.test(texto)
    ) {

        resultado.security =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       MIGRACIÓN
    ----------------------------------------- */

    if (
        /migración/i.test(texto) ||
        /migracion/i.test(texto) ||
        /\bmigrar\b/i.test(texto) ||
        /migraci[oó]n de datos/i.test(texto)
    ) {

        resultado.migration =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       SOPORTE
    ----------------------------------------- */

    if (
        /soporte/i.test(texto) ||
        /mesa de ayuda/i.test(texto) ||
        /help desk/i.test(texto)
    ) {

        resultado.support =
            `Sí — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       PLAZOS
    ----------------------------------------- */

    const plazo =
        detectarDato(
            texto,
            [

                /(\d+)\s*(días|dias|semanas|meses)\b/i,

                /plazo\s*[:\-]?\s*([^.;]+)/i,

                /fecha límite\s*[:\-]?\s*([^.;]+)/i,

                /fecha limite\s*[:\-]?\s*([^.;]+)/i

            ]
        );

    if (plazo) {

        resultado.deadlines =
            `${plazo} — Página ${pagina.page}`;

    }


    /* -----------------------------------------
       INFORMACIÓN ECONÓMICA
    ----------------------------------------- */

    if (
        /precio/i.test(texto) ||
        /presupuesto/i.test(texto) ||
        /cotización/i.test(texto) ||
        /cotizacion/i.test(texto) ||
        /costo/i.test(texto) ||
        /importe/i.test(texto)
    ) {

        resultado.pricing =
            `Se detecta información económica — Página ${pagina.page}`;

    }


    return resultado;

}


/* =========================================================
   DETECCIÓN GENERAL SOBRE TODAS LAS PÁGINAS
========================================================= */

function detectarCategorias(paginas) {

    const categorias = {

        users: "",
        documents: "",
        volume: "",
        storage: "",
        ocr: "",
        fulltext: "",
        workflows: "",
        signatures: "",
        integrations: "",
        infrastructure: "",
        security: "",
        migration: "",
        support: "",
        deadlines: "",
        pricing: ""

    };


    for (const pagina of paginas) {

        const datos =
            detectarCategoriasPorPagina(
                pagina
            );

        Object.entries(datos)
            .forEach(
                ([clave, valor]) => {

                    if (
                        valor &&
                        !categorias[clave]
                    ) {

                        categorias[clave] =
                            valor;

                    }

                }
            );

    }

    return categorias;

}


/* =========================================================
   DETECTAR CLIENTE
========================================================= */

function detectarCliente(paginas) {

    const patrones = [

        /(?:cliente|empresa|comitente|raz[oó]n social)\s*[:\-]\s*([^.;\n]+)/i,

        /(?:cliente|empresa)\s+([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑ0-9 .,&_-]{2,80})/i

    ];

    for (const pagina of paginas) {

        for (const patron of patrones) {

            const match =
                pagina.text.match(
                    patron
                );

            if (
                match &&
                match[1]
            ) {

                return {
                    value: limpiarComillas(
                        limpiarTexto(
                            match[1]
                        )
                    ),
                    page: pagina.page
                };

            }

        }

    }

    return null;

}


/* =========================================================
   DETECTAR OBJETIVO
========================================================= */

function detectarObjetivo(paginas) {

    const patrones = [

        /objetivo\s*[:\-]\s*([^.;]{20,500})/i,

        /finalidad\s*[:\-]\s*([^.;]{20,500})/i,

        /propósito\s*[:\-]\s*([^.;]{20,500})/i,

        /proposito\s*[:\-]\s*([^.;]{20,500})/i,

        /se requiere\s+([^.;]{20,500})/i,

        /la solución deberá\s+([^.;]{20,500})/i,

        /la solucion debera\s+([^.;]{20,500})/i

    ];

    for (const pagina of paginas) {

        for (const patron of patrones) {

            const match =
                pagina.text.match(
                    patron
                );

            if (
                match &&
                match[1]
            ) {

                return {
                    value: limpiarComillas(
                        limpiarTexto(
                            match[1]
                        )
                    ),
                    page: pagina.page
                };

            }

        }

    }

    return null;

}


/* =========================================================
   BUSCAR EVIDENCIA
========================================================= */

function buscarEvidencia(paginas, palabras) {

    const resultados = [];

    for (const pagina of paginas) {

        const textoNormalizado =
            normalizar(
                pagina.text
            );

        const coincide =
            palabras.some(
                palabra =>
                    textoNormalizado.includes(
                        normalizar(palabra)
                    )
            );

        if (coincide) {

            resultados.push({

                page: pagina.page,

                text:
                    limpiarComillas(
                        pagina.text.substring(
                            0,
                            900
                        )
                    )

            });

        }

    }

    return resultados;

}


/* =========================================================
   CONSULTA PRIORITARIA
========================================================= */

function buscarConsulta(
    consulta,
    paginas
) {

    const palabras =
        normalizar(consulta)
            .split(/\s+/)
            .filter(
                p =>
                    p.length > 3 &&
                    ![
                        "cuántos",
                        "cuantos",
                        "necesita",
                        "necesitan",
                        "qué",
                        "que",
                        "solicita",
                        "solicitan",
                        "necesita"
                    ].includes(p)
            )
            .slice(0, 10);


    if (!palabras.length) {

        return {

            encontrado: false,

            texto:
                "No se ingresó una consulta prioritaria."

        };

    }


    const resultados =
        buscarEvidencia(
            paginas,
            palabras
        );


    if (!resultados.length) {

        return {

            encontrado: false,

            texto:
                "No encontré una coincidencia directa con la búsqueda indicada. Revisá también el análisis general."

        };

    }


    return {

        encontrado: true,

        resultados:
            resultados

    };

}


/* =========================================================
   CONSTRUIR ANÁLISIS
========================================================= */

function construirAnalisis(
    fileName,
    paginas,
    consulta,
    prioridad,
    categorias
) {

    const evidencia = [];

    for (const pagina of paginas) {

        if (!pagina.text) {
            continue;
        }

        evidencia.push({

            page: pagina.page,

            text:
                limpiarComillas(
                    pagina.text.substring(
                        0,
                        900
                    )
                )

        });

    }


    const temas = [];

    Object.entries(categorias)
        .forEach(
            ([clave, valor]) => {

                if (valor) {
                    temas.push(clave);
                }

            }
        );


    const cliente =
        detectarCliente(
            paginas
        );

    const objetivo =
        detectarObjetivo(
            paginas
        );


    /*
     * Datos enriquecidos.
     * Los dejamos además de "categories"
     * para que analisis.html pueda utilizarlos
     * sin romper la estructura existente.
     */

    const categoryDetails = {};


    Object.entries(categorias)
        .forEach(
            ([clave, valor]) => {

                if (!valor) {
                    return;
                }

                const paginaMatch =
                    valor.match(
                        /Página\s+(\d+)/i
                    );

                categoryDetails[clave] = {

                    value: valor,

                    page:
                        paginaMatch
                            ? Number(
                                paginaMatch[1]
                            )
                            : null

                };

            }
        );


    return {

        fileName: fileName,

        pages: paginas.length,

        consultaPrioritaria:
            consulta,

        prioridad:
            prioridad,

        objective:
            objetivo
                ? objetivo.value
                : (
                    consulta ||
                    "Analizar los requerimientos de Preventa del documento."
                ),

        objectivePage:
            objetivo
                ? objetivo.page
                : null,

        client:
            cliente
                ? cliente.value
                : "",

        clientPage:
            cliente
                ? cliente.page
                : null,

        temas: temas,

        categories:
            categorias,

        categoryDetails:
            categoryDetails,

        evidence:
            evidencia,

        /*
         * Información adicional para la V2.
         */

        extraction: {

            nativeTextAvailable:
                paginas.some(
                    p => !!p.nativeText
                ),

            ocrExecuted:
                true,

            pagesProcessed:
                paginas.length

        },

        generatedAt:
            new Date().toISOString()

    };

}


/* =========================================================
   MOSTRAR CATEGORÍAS
========================================================= */

function mostrarCategorias(

) {

    const nombres = {

        documents: "📄 Documentos",

        volume: "📊 Volumen",

        storage: "💾 Almacenamiento",

        ocr: "🔍 OCR",

        fulltext: "🔎 Texto completo",

        workflows: "🔄 Workflows",

        signatures: "✍️ Firmas",

        integrations: "🔗 Integraciones",

        infrastructure: "☁️ Infraestructura",

        security: "🔐 Seguridad",

        migration: "🚚 Migración",

        support: "🛠️ Soporte",

        deadlines: "📅 Plazos",

        pricing: "💰 Información económica"

    };


    Object.entries(categorias)
        .forEach(
            ([clave, valor]) => {

                if (!valor) {
                    return;
                }

                const card =
                    document.createElement(

                    );

                card.className =

                        )}

                            )
                        )}
                    </p>
                `;

            }
        );


    if (!grid.children.length) {

        grid.innerHTML = `
            <div class="category-card">

                <h4>
                    ℹ️ Sin datos concretos
                </h4>

                <p>
                    No se detectaron datos específicos
                    en las categorías analizadas.
                </p>

            </div>
        `;

    }

}


/* =========================================================
   MOSTRAR EVIDENCIA
========================================================= */

function mostrarEvidencia(
    evidencia
) {

    const contenedor =
        document.getElementById(
            "evidenceList"
        );

    contenedor.innerHTML = "";


    evidencia
        .slice(0, 20)
        .forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "evidence-item";

                div.innerHTML = `

                    <strong>
                        Página ${item.page}
                    </strong>

                    <div class="result-content">

                        ${escaparHTML(
                            limpiarComillas(
                                item.text
                            )
                        )}

                    </div>
                `;

                contenedor.appendChild(
                    div
                );

            }
        );


    if (!contenedor.children.length) {

        contenedor.innerHTML =
            "<p>No se encontró evidencia textual.</p>";

    }

}


/* =========================================================
   ANALIZAR DOCUMENTO
========================================================= */

async function analyzeDocument() {

    if (!archivoActual) {

        alert(
            "Primero seleccioná un documento PDF o TXT."
        );

        return;

    }


    const consulta =
        document.getElementById(
            "consulta"
        ).value.trim();


    const loading =
        document.getElementById(
            "loading"
        );

    const resultados =
        document.getElementById(
            "resultados"
        );

    const priorityResult =
        document.getElementById(
            "priorityResult"
        );

    const priorityContent =
        document.getElementById(
            "priorityContent"
        );


    loading.classList.remove(
        "hidden"
    );

    resultados.classList.add(
        "hidden"
    );


    document.getElementById(
        "loadingText"
    ).textContent =
        "📄 Extrayendo información del documento...";


    try {

        let paginas = [];


        if (
            archivoActual.type ===
                "application/pdf" ||
            archivoActual.name
                .toLowerCase()
                .endsWith(".pdf")
        ) {

            paginas =
                await extraerPDF(
                    archivoActual
                );

        } else {

            paginas = [

                {
                    page: 1,

                    text:
                        textoDocumento,

                    nativeText:
                        textoDocumento,

                    ocrText: ""

                }

            ];

        }


        document.getElementById(
            "loadingText"
        ).textContent =
            "🧠 Analizando requerimientos de Preventa...";


        /*
         * Ahora analizamos por página.
         * Esto permite conservar el origen
         * de cada dato.
         */

        const categorias =
            detectarCategorias(
                paginas
            );


        const prioridad =
            buscarConsulta(
                consulta,
                paginas
            );


        if (prioridad.encontrado) {

            priorityContent.innerHTML =
                prioridad.resultados
                    .map(
                        item => `

                            <div class="evidence-item">

                                <strong>
                                    Página ${item.page}
                                </strong>

                                <div class="result-content">

                                    ${escaparHTML(
                                        limpiarComillas(
                                            item.text
                                        )
                                    )}

                                </div>

                            </div>
                        `
                    )
                    .join("");

        } else {

            priorityContent.textContent =
                limpiarComillas(
                    prioridad.texto
                );

        }


        priorityResult.style.display =
            "block";


        mostrarCategorias(
            categorias
        );


        const analisis =
            construirAnalisis(
                archivoActual.name,
                paginas,
                consulta,
                prioridad,
                categorias
            );


        mostrarEvidencia(
            analisis.evidence
        );


        ultimoAnalisis =
            analisis;


        /*
         * Guardamos el análisis completo.
         */

        localStorage.setItem(
            "preventa_document_analysis",
            JSON.stringify(
                analisis
            )
        );


        loading.classList.add(
            "hidden"
        );

        resultados.classList.remove(
            "hidden"
        );


        mostrarStatus(
            "✅ Análisis terminado correctamente. OCR + extracción procesados."
        );


        resultados.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });


    } catch (error) {

        console.error(
            "Error completo:",
            error
        );


        loading.classList.add(
            "hidden"
        );


        mostrarStatus(
            "❌ Ocurrió un error al analizar el documento."
        );


        alert(
            "No se pudo analizar el documento. Revisá la consola si querés ver el detalle."
        );

    }

}

window.analyzeDocument =
    analyzeDocument;


/* =========================================================
   PASAR A ANÁLISIS
========================================================= */

function pasarAAnalisis() {

    try {

        let datos =
            ultimoAnalisis;


        if (!datos) {

            const guardado =
                localStorage.getItem(
                    "preventa_document_analysis"
                );


            if (guardado) {

                datos =
                    JSON.parse(
                        guardado
                    );

            }

        }


        if (!datos) {

            alert(
                "Primero analizá un documento."
            );

            return;

        }


        /*
         * Guardamos nuevamente para asegurar
         * que analisis.html reciba exactamente
         * el último análisis realizado.
         */

        localStorage.setItem(
            "preventa_document_analysis",
            JSON.stringify(
                datos
            )
        );


        mostrarStatus(
            "📊 Abriendo el análisis completo..."
        );


        const destino =
            new URL(
                "analisis.html",
                window.location.href
            ).href;


        window.location.assign(
            destino
        );


    } catch (error) {

        console.error(
            "Error al pasar a análisis:",
            error
        );


        alert(
            "No se pudo abrir la pantalla de Análisis."
        );

    }

}


document
    .getElementById(
        "btnPasarAnalisis"
    )
    .addEventListener(
        "click",
        pasarAAnalisis
    );


window.pasarAAnalisis =
    pasarAAnalisis;

</script>
