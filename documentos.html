<!-- PDF.js -->
<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


let archivoActual = null;
let textoDocumento = "";
let paginasDocumento = 0;
let ultimoAnalisis = null;


/* =========================================================
   UTILIDADES
========================================================= */

function limpiarComillas(texto) {

    let resultado = String(texto || "").trim();

    resultado = resultado.replace(
        /^[\s"'“”„‟«»]+/,
        ""
    );

    resultado = resultado.replace(
        /[\s"'“”„‟«»]+$/,
        ""
    );

    return resultado.trim();
}


function limpiarTexto(texto) {

    return String(texto || "")
        .replace(/\r/g, " ")
        .replace(/\n+/g, " ")
        .replace(/\s{2,}/g, " ")
        .trim();

}


function escaparHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function normalizar(texto) {

    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

}


function mostrarStatus(texto) {

    const status = document.getElementById("status");

    status.textContent = texto;
    status.style.display = "block";

}


/* =========================================================
   EJEMPLOS
========================================================= */

function usarEjemplo(texto) {

    document.getElementById("consulta").value = texto;

}

window.usarEjemplo = usarEjemplo;


/* =========================================================
   CARGA DEL ARCHIVO
========================================================= */

document.getElementById("archivo").addEventListener(
    "change",
    async function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        archivoActual = file;

        const preview = document.getElementById("preview");
        const pdfPreview = document.getElementById("pdfPreview");
        const txtPreview = document.getElementById("txtPreview");

        preview.style.display = "block";

        if (
            file.type === "application/pdf" ||
            file.name.toLowerCase().endsWith(".pdf")
        ) {

            pdfPreview.style.display = "block";
            txtPreview.style.display = "none";

            pdfPreview.src = URL.createObjectURL(file);

        } else {

            pdfPreview.style.display = "none";
            txtPreview.style.display = "block";

            const texto = await file.text();

            textoDocumento = texto;

            txtPreview.textContent = texto;

        }

        mostrarStatus(
            "📄 Documento cargado correctamente. Ahora podés indicar qué querés buscar."
        );

    }
);


/* =========================================================
   EXTRACCIÓN PDF
========================================================= */

async function extraerPDF(file) {

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: buffer
    }).promise;

    paginasDocumento = pdf.numPages;

    let paginas = [];

    for (let numero = 1; numero <= pdf.numPages; numero++) {

        const pagina = await pdf.getPage(numero);

        const contenido = await pagina.getTextContent();

        let texto = contenido.items
            .map(item => item.str || "")
            .join(" ");

        texto = limpiarTexto(texto);

        paginas.push({
            page: numero,
            text: texto
        });

    }

    textoDocumento = paginas
        .map(p => p.text)
        .join("\n\n");

    return paginas;

}


/* =========================================================
   BUSCAR EVIDENCIA
========================================================= */

function buscarEvidencia(paginas, palabras) {

    const resultados = [];

    for (const pagina of paginas) {

        const textoNormalizado = normalizar(pagina.text);

        const coincide = palabras.some(
            palabra =>
                textoNormalizado.includes(
                    normalizar(palabra)
                )
        );

        if (coincide) {

            resultados.push({
                page: pagina.page,
                text: limpiarComillas(
                    pagina.text.substring(0, 700)
                )
            });

        }

    }

    return resultados;

}


/* =========================================================
   DETECCIÓN DE DATOS
========================================================= */

function detectarDato(texto, patrones) {

    for (const patron of patrones) {

        const match = texto.match(patron);

        if (match && match[1]) {

            return limpiarComillas(
                match[1].trim()
            );

        }

    }

    return "";

}


function extraerUsuarios(texto) {

    return detectarDato(texto, [

        /(\d[\d\.\,]*)\s*(usuarios|user|users)/i,

        /usuarios\s*[:\-]?\s*(\d[\d\.\,]*)/i,

        /cantidad de usuarios\s*[:\-]?\s*(\d[\d\.\,]*)/i

    ]);

}


function detectarCategorias(texto) {

    const t = normalizar(texto);

    const categorias = {

        users: detectarDato(texto, [
            /(\d[\d\.\,]*)\s*(usuarios|user|users)/i,
            /usuarios\s*[:\-]?\s*(\d[\d\.\,]*)/i
        ]),

        documents: "",
        volume: "",
        storage: "",
        ocr: "",
        fulltext: "",
        workflows: "",
        signatures: "",
        integrations: "",
        infrastructure: "",
        security: "",
        migration: "",
        support: "",
        deadlines: "",
        pricing: ""

    };


    if (
        t.includes("documentos") ||
        t.includes("expedientes") ||
        t.includes("legajos")
    ) {

        categorias.documents =
            "Se detectan referencias a documentos, expedientes o legajos.";

    }


    const volumen = detectarDato(texto, [
        /(\d[\d\.\,]*)\s*(documentos|expedientes|legajos)/i
    ]);

    if (volumen) {
        categorias.volume = volumen;
    }


    const almacenamiento = detectarDato(texto, [
        /(\d[\d\.\,]*)\s*(gb|tb|mb)/i,
        /almacenamiento\s*[:\-]?\s*([^.;]+)/i
    ]);

    if (almacenamiento) {
        categorias.storage = almacenamiento;
    }


    if (
        t.includes("ocr") ||
        t.includes("reconocimiento óptico") ||
        t.includes("reconocimiento de caracteres")
    ) {

        categorias.ocr =
            "El documento contiene referencias a OCR o reconocimiento de caracteres.";

    }


    if (
        t.includes("texto completo") ||
        t.includes("full text") ||
        t.includes("búsqueda de texto") ||
        t.includes("busqueda de texto")
    ) {

        categorias.fulltext =
            "Se detecta necesidad de búsqueda o consulta por texto completo.";

    }


    if (
        t.includes("workflow") ||
        t.includes("workflows") ||
        t.includes("flujo de trabajo") ||
        t.includes("circuito de aprobación")
    ) {

        categorias.workflows =
            "Se detectan referencias a workflows, circuitos o procesos.";

    }


    if (
        t.includes("firma digital") ||
        t.includes("firma electrónica") ||
        t.includes("firmas digitales")
    ) {

        categorias.signatures =
            "Se detectan requerimientos relacionados con firma digital o electrónica.";

    }


    if (
        t.includes("api") ||
        t.includes("integración") ||
        t.includes("integraciones") ||
        t.includes("web service")
    ) {

        categorias.integrations =
            "Se detectan referencias a integraciones, APIs o servicios externos.";

    }


    if (
        t.includes("cloud") ||
        t.includes("nube") ||
        t.includes("on-premise") ||
        t.includes("on premise") ||
        t.includes("servidor")
    ) {

        if (
            t.includes("on-premise") ||
            t.includes("on premise")
        ) {

            categorias.infrastructure =
                "Se detecta infraestructura On-Premise.";

        } else if (
            t.includes("cloud") ||
            t.includes("nube")
        ) {

            categorias.infrastructure =
                "Se detecta infraestructura Cloud.";

        } else {

            categorias.infrastructure =
                "Se detectan referencias a infraestructura o servidores.";

        }

    }


    if (
        t.includes("seguridad") ||
        t.includes("autenticación") ||
        t.includes("autorización") ||
        t.includes("sso")
    ) {

        categorias.security =
            "Se detectan requerimientos de seguridad, autenticación o autorización.";

    }


    if (
        t.includes("migración") ||
        t.includes("migracion") ||
        t.includes("migrar")
    ) {

        categorias.migration =
            "Se detectan referencias a migración de información o sistemas.";

    }


    if (
        t.includes("soporte") ||
        t.includes("mesa de ayuda") ||
        t.includes("help desk")
    ) {

        categorias.support =
            "Se detectan requerimientos relacionados con soporte.";

    }


    if (
        t.includes("fecha límite") ||
        t.includes("fecha limite") ||
        t.includes("plazo") ||
        t.includes("deadline")
    ) {

        categorias.deadlines =
            "Se detectan referencias a plazos o fechas límite.";

    }


    if (
        t.includes("precio") ||
        t.includes("presupuesto") ||
        t.includes("cotización") ||
        t.includes("cotizacion") ||
        t.includes("costo")
    ) {

        categorias.pricing =
            "El documento contiene referencias económicas, de presupuesto o cotización.";

    }


    return categorias;

}


/* =========================================================
   CONSULTA PRIORITARIA
========================================================= */

function buscarConsulta(consulta, paginas) {

    const palabras = normalizar(consulta)
        .split(/\s+/)
        .filter(p => p.length > 3)
        .slice(0, 10);

    if (!palabras.length) {

        return {
            encontrado: false,
            texto: "No se ingresó una consulta prioritaria."
        };

    }


    const resultados = buscarEvidencia(
        paginas,
        palabras
    );


    if (!resultados.length) {

        return {
            encontrado: false,
            texto:
                "No encontré una coincidencia directa con la búsqueda indicada. Revisá también el análisis general."
        };

    }


    return {
        encontrado: true,
        resultados: resultados
    };

}


/* =========================================================
   CONSTRUIR ANÁLISIS
========================================================= */

function construirAnalisis(
    fileName,
    paginas,
    consulta,
    prioridad,
    categorias
) {

    const evidencia = [];

    for (const pagina of paginas) {

        if (!pagina.text) {
            continue;
        }

        evidencia.push({

            page: pagina.page,

            text: limpiarComillas(
                pagina.text.substring(0, 700)
            )

        });

    }


    const temas = [];

    Object.entries(categorias).forEach(
        ([clave, valor]) => {

            if (valor) {
                temas.push(clave);
            }

        }
    );


    return {

        fileName: fileName,

        pages: paginas.length,

        consultaPrioritaria: consulta,

        prioridad: prioridad,

        objective:
            consulta ||
            "Analizar los requerimientos de Preventa del documento.",

        client: "",

        temas: temas,

        categories: categorias,

        evidence: evidencia

    };

}


/* =========================================================
   MOSTRAR CATEGORÍAS
========================================================= */

function mostrarCategorias(categorias) {

    const grid =
        document.getElementById("categoryGrid");

    grid.innerHTML = "";

        users: "👥 Usuarios",

        documents: "📄 Documentos",

        volume: "📊 Volumen",

        storage: "💾 Almacenamiento",

        ocr: "🔍 OCR",

        fulltext: "🔎 Texto completo",

        workflows: "🔄 Workflows",

        signatures: "✍️ Firmas",

        integrations: "🔗 Integraciones",

        infrastructure: "☁️ Infraestructura",

        security: "🔐 Seguridad",

        migration: "🚚 Migración",

        support: "🛠️ Soporte",

        deadlines: "📅 Plazos",

        pricing: "💰 Información económica"

    };


    Object.entries(categorias).forEach(
        ([clave, valor]) => {

            if (!valor) {
                return;
            }

            const card =
                document.createElement("div");

            card.className = "category-card";

            card.innerHTML = `
                <h4>${escaparHTML(nombres[clave] || clave)}</h4>
                <p class="result-content">
                    ${escaparHTML(limpiarComillas(valor))}
                </p>
            `;

            grid.appendChild(card);

        }
    );


    if (!grid.children.length) {

        grid.innerHTML = `
            <div class="category-card">
                <h4>ℹ️ Sin datos concretos</h4>
                <p>
                    No se detectaron datos específicos en las categorías analizadas.
                </p>
            </div>
        `;

    }

}


/* =========================================================
   MOSTRAR EVIDENCIA
========================================================= */

function mostrarEvidencia(evidencia) {

    const contenedor =
        document.getElementById("evidenceList");

    contenedor.innerHTML = "";


    evidencia
        .slice(0, 20)
        .forEach(item => {

            const div =
                document.createElement("div");

            div.className = "evidence-item";

            div.innerHTML = `
                <strong>Página ${item.page}</strong>
                <div class="result-content">
                    ${escaparHTML(
                        limpiarComillas(item.text)
                    )}
                </div>
            `;

            contenedor.appendChild(div);

        });


    if (!contenedor.children.length) {

        contenedor.innerHTML =
            "<p>No se encontró evidencia textual.</p>";

    }

}


/* =========================================================
   ANALIZAR DOCUMENTO
========================================================= */

async function analyzeDocument() {

    if (!archivoActual) {

        alert(
            "Primero seleccioná un documento PDF o TXT."
        );

        return;

    }


    const consulta =
        document.getElementById("consulta")
            .value
            .trim();


    const loading =
        document.getElementById("loading");

    const resultados =
        document.getElementById("resultados");

    const priorityResult =
        document.getElementById("priorityResult");

    const priorityContent =
        document.getElementById("priorityContent");


    loading.classList.remove("hidden");

    resultados.classList.add("hidden");

    document.getElementById(
        "loadingText"
    ).textContent =
        "📄 Extrayendo información del documento...";


    try {

        let paginas = [];


        if (
            archivoActual.type === "application/pdf" ||
            archivoActual.name.toLowerCase().endsWith(".pdf")
        ) {

            paginas =
                await extraerPDF(
                    archivoActual
                );

        } else {

            paginas = [
                {
                    page: 1,
                    text: textoDocumento
                }
            ];

        }


        document.getElementById(
            "loadingText"
        ).textContent =
            "🧠 Analizando requerimientos de Preventa...";


        const categorias =
            detectarCategorias(
                textoDocumento
            );


        const prioridad =
            buscarConsulta(
                consulta,
                paginas
            );


        if (prioridad.encontrado) {

            priorityContent.innerHTML =
                prioridad.resultados
                    .map(item => `
                        <div class="evidence-item">
                            <strong>Página ${item.page}</strong>
                            <div class="result-content">
                                ${escaparHTML(
                                    limpiarComillas(item.text)
                                )}
                            </div>
                        </div>
                    `)
                    .join("");

        } else {

            priorityContent.textContent =
                limpiarComillas(
                    prioridad.texto
                );

        }


        priorityResult.style.display =
            "block";


        mostrarCategorias(categorias);


        const analisis =
            construirAnalisis(
                archivoActual.name,
                paginas,
                consulta,
                prioridad,
                categorias
            );


        mostrarEvidencia(
            analisis.evidence
        );


        ultimoAnalisis = analisis;


        localStorage.setItem(
            "preventa_document_analysis",
            JSON.stringify(analisis)
        );


        loading.classList.add("hidden");

        resultados.classList.remove("hidden");


        mostrarStatus(
            "✅ Análisis terminado correctamente."
        );


        resultados.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });


    } catch (error) {

        console.error(error);

        loading.classList.add("hidden");

        mostrarStatus(
            "❌ Ocurrió un error al analizar el documento."
        );

        alert(
            "No se pudo analizar el documento. Revisá la consola si querés ver el detalle."
        );

    }

}

window.analyzeDocument = analyzeDocument;


/* =========================================================
   PASAR A ANÁLISIS
========================================================= */

function pasarAAnalisis() {

    try {

        let datos = ultimoAnalisis;


        if (!datos) {

            const guardado =
                localStorage.getItem(
                    "preventa_document_analysis"
                );


            if (guardado) {

                datos =
                    JSON.parse(guardado);

            }

        }


        if (!datos) {

            alert(
                "Primero analizá un documento."
            );

            return;

        }


        /* Guardamos nuevamente para asegurarnos
           de que analisis.html reciba el resultado */

        localStorage.setItem(
            "preventa_document_analysis",
            JSON.stringify(datos)
        );


        mostrarStatus(
            "📊 Abriendo el análisis completo..."
        );


        /*
         * URL relativa robusta:
         * funciona aunque el proyecto esté
         * publicado dentro de una carpeta.
         */

        const destino =
            new URL(
                "analisis.html",
                window.location.href
            ).href;


        window.location.assign(destino);


    } catch (error) {

        console.error(
            "Error al pasar a análisis:",
            error
        );

        alert(
            "No se pudo abrir la pantalla de Análisis."
        );

    }

}


/*
 * Además del onclick, dejamos el evento
 * conectado directamente al botón.
 * Esto evita que falle si el navegador
 * tiene algún problema con el onclick.
 */

document
    .getElementById("btnPasarAnalisis")
    .addEventListener(
        "click",
        pasarAAnalisis
    );


window.pasarAAnalisis =
    pasarAAnalisis;

</script>
