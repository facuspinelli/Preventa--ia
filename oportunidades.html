<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oportunidades | PREVENTA IA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #172033;
}

header {
  background: #111827;
  color: white;
  padding: 18px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.container {
  max-width: 1400px;
  margin: 30px auto;
  padding: 0 20px;
}

.page-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 25px;
}

.page-title h2 {
  margin: 0 0 7px;
  font-size: 30px;
}

.page-title p {
  margin: 0;
  color: #6b7280;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}

button:hover {
  opacity: .92;
}

.primary {
  background: #2563eb;
  color: white;
}

.dark {
  background: #111827;
  color: white;
}

.green {
  background: #15803d;
  color: white;
}

.red {
  background: #dc2626;
  color: white;
}

.gray {
  background: #e5e7eb;
  color: #1f2937;
}

.small {
  padding: 8px 11px;
  font-size: 12px;
}

/* RESUMEN */

.summary {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.summary-card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
  border-top: 4px solid #d1d5db;
}

.summary-card h3 {
  margin: 0 0 8px;
  font-size: 13px;
  color: #6b7280;
}

.summary-number {
  font-size: 27px;
  font-weight: bold;
}

.summary-card.new {
  border-color: #64748b;
}

.summary-card.analysis {
  border-color: #f59e0b;
}

.summary-card.quote {
  border-color: #2563eb;
}

.summary-card.proposal {
  border-color: #7c3aed;
}

.summary-card.won {
  border-color: #16a34a;
}

.summary-card.lost {
  border-color: #dc2626;
}

/* TOOLBAR */

.toolbar {
  background: white;
  border-radius: 12px;
  padding: 15px;
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.toolbar input,
.toolbar select {
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
}

.toolbar input {
  flex: 1;
}

/* PIPELINE */

.pipeline {
  display: grid;
  grid-template-columns: repeat(6, minmax(210px, 1fr));
  gap: 14px;
  align-items: start;
  overflow-x: auto;
  padding-bottom: 10px;
}

.column {
  background: #e9edf2;
  border-radius: 12px;
  min-height: 300px;
  padding: 10px;
}

.column-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 5px 12px;
}

.column-header strong {
  font-size: 13px;
}

.column-count {
  background: white;
  border-radius: 20px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: bold;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  cursor: pointer;
}

.card:hover {
  box-shadow: 0 5px 15px rgba(0,0,0,.10);
}

.card-company {
  font-size: 11px;
  color: #6b7280;
  margin-bottom: 5px;
}

.card-title {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 8px;
}

.card-solution {
  font-size: 12px;
  color: #374151;
  margin-bottom: 10px;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #edf0f2;
  padding-top: 9px;
  font-size: 11px;
  color: #6b7280;
}

.empty-column {
  color: #9ca3af;
  font-size: 12px;
  text-align: center;
  padding: 30px 10px;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 950px;
  max-height: 94vh;
  overflow-y: auto;
  background: white;
  border-radius: 15px;
  padding: 28px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 20px;
}

.modal-header h3 {
  margin: 0 0 5px;
  font-size: 23px;
}

.modal-header p {
  margin: 0;
  color: #6b7280;
  font-size: 13px;
}

.close {
  background: #e5e7eb;
  color: #111827;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  padding: 0;
  font-size: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #2563eb;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 25px;
}

/* DETALLE */

.detail-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 18px;
}

.detail-box {
  background: #f8fafc;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 15px;
}

.detail-box h4 {
  margin: 0 0 12px;
  font-size: 14px;
}

.detail-value {
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 14px;
  color: #374151;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.info-item {
  background: white;
  border-radius: 8px;
  padding: 11px;
}

.info-label {
  font-size: 10px;
  color: #6b7280;
  margin-bottom: 4px;
}

.info-value {
  font-size: 13px;
  font-weight: bold;
}

.product-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.product-tag {
  background: #dbeafe;
  color: #1e40af;
  padding: 6px 9px;
  border-radius: 15px;
  font-size: 11px;
}

.next-action {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 10px;
  padding: 14px;
}

.next-action strong {
  display: block;
  color: #9a3412;
  margin-bottom: 5px;
}

.detail-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 15px;
  font-size: 11px;
  font-weight: bold;
}

.badge-new {
  background: #e2e8f0;
  color: #334155;
}

.badge-analysis {
  background: #fef3c7;
  color: #92400e;
}

.badge-quote {
  background: #dbeafe;
  color: #1e40af;
}

.badge-proposal {
  background: #ede9fe;
  color: #5b21b6;
}

.badge-won {
  background: #dcfce7;
  color: #166534;
}

.badge-lost {
  background: #fee2e2;
  color: #991b1b;
}

@media (max-width: 1200px) {
  .summary {
    grid-template-columns: repeat(3, 1fr);
  }

  .pipeline {
    grid-template-columns: repeat(6, 230px);
  }
}

@media (max-width: 700px) {
  header {
    padding: 15px;
  }

  .page-title {
    flex-direction: column;
  }

  .summary {
    grid-template-columns: repeat(2, 1fr);
  }

  .toolbar {
    flex-direction: column;
  }

  .form-grid,
  .detail-grid,
  .info-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>💼 PREVENTA IA</h1>

  <a href="index.html" class="back">
    ← Volver al inicio
  </a>
</header>

<main class="container">

  <div class="page-title">
    <div>
      <h2>Oportunidades</h2>
      <p>
        Centro de gestión del ciclo comercial y técnico de Preventa.
      </p>
    </div>

    <button class="primary" onclick="openNewOpportunity()">
      + Nueva oportunidad
    </button>
  </div>

  <!-- RESUMEN -->

  <section class="summary">

    <div class="summary-card new">
      <h3>Nueva</h3>
      <div class="summary-number" id="count-new">0</div>
    </div>

    <div class="summary-card analysis">
      <h3>En análisis</h3>
      <div class="summary-number" id="count-analysis">0</div>
    </div>

    <div class="summary-card quote">
      <h3>Cotizando</h3>
      <div class="summary-number" id="count-quote">0</div>
    </div>

    <div class="summary-card proposal">
      <h3>Propuesta</h3>
      <div class="summary-number" id="count-proposal">0</div>
    </div>

    <div class="summary-card won">
      <h3>Ganadas</h3>
      <div class="summary-number" id="count-won">0</div>
    </div>

    <div class="summary-card lost">
      <h3>Perdidas</h3>
      <div class="summary-number" id="count-lost">0</div>
    </div>

  </section>

  <!-- BUSCADOR -->

  <section class="toolbar">

    <input
      id="search"
      type="text"
      placeholder="🔎 Buscar empresa, oportunidad, contacto, solución..."
      oninput="render()"
    >

    <select id="filterStage" onchange="render()">

      <option value="all">
        Todos los estados
      </option>

      <option value="new">
        Nueva
      </option>

      <option value="analysis">
        En análisis
      </option>

      <option value="quote">
        Cotizando
      </option>

      <option value="proposal">
        Propuesta
      </option>

      <option value="won">
        Ganada
      </option>

      <option value="lost">
        Perdida
      </option>

    </select>

    <button class="gray" onclick="clearFilters()">
      Limpiar
    </button>

  </section>

  <!-- PIPELINE -->

  <section class="pipeline" id="pipeline"></section>

</main>


<!-- =====================================================
     MODAL NUEVA / EDITAR
===================================================== -->

<div class="modal" id="opportunityModal">

  <div class="modal-content">

    <div class="modal-header">

      <div>
        <h3 id="modalTitle">
          Nueva oportunidad
        </h3>

        <p>
          Registrá la información principal de la oportunidad.
        </p>
      </div>

      <button class="close" onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="form-grid">

      <div>
        <label>Empresa / Cliente *</label>

        <input
          id="fCompany"
          type="text"
          placeholder="Ej: Banco CMF"
        >
      </div>

      <div>
        <label>Oportunidad / Proyecto *</label>

        <input
          id="fTitle"
          type="text"
          placeholder="Ej: Gestión documental"

      </div>

      <div>
        <label>Contacto</label>

        <input
          id="fContact"
          type="text"
          placeholder="Nombre del contacto"
        >
      </div>

      <div>
        <label>Origen</label>

        <select id="fOrigin">

          <option value="Comercial">
            Comercial
          </option>

          <option value="Pliego">
            Pliego
          </option>

          <option value="Relevamiento">
            Relevamiento
          </option>

          <option value="Mercado">
            Mercado
          </option>

          <option value="Renovación">
            Renovación
          </option>

          <option value="Referido">
            Referido
          </option>

          <option value="Otro">
            Otro
          </option>

        </select>
      </div>

      <div>
        <label>Estado</label>

        <select id="fStage">

          <option value="new">
            Nueva
          </option>

          <option value="analysis">
            En análisis
          </option>

          <option value="quote">
            Cotizando
          </option>

          <option value="proposal">
            Propuesta
          </option>

          <option value="won">
            Ganada
          </option>

        ></textarea>

      <div class="full">

          id="fRequirements"
          placeholder="Usuarios, almacenamiento, documentos, OCR, workflows, firmas, integraciones, migración, etc."
        ></textarea>
      </div>

      <div class="full">
        <label>Solución propuesta</label>

        <textarea
          id="fSolution"
          placeholder="Describí la solución técnica que se está evaluando."
        ></textarea>
      </div>

      <div class="full">
        <label>Productos involucrados</label>

        <input
          id="fProducts"
          type="text"
          placeholder="Ej: Thuban, Captika, Firmas Addoc"
        >
      </div>

      <div class="full">
        <label>Riesgos / puntos a validar</label>

        <textarea
          id="fRisks"
          placeholder="Integraciones, alcance, migración, firma, infraestructura, información faltante..."
        ></textarea>
      </div>

      <div class="full">
        <label>Próxima acción</label>

        <textarea
          id="fNextAction"
          placeholder="Ej: Validar cantidad de workflows con cliente."
        ></textarea>
      </div>

      <button class="gray" onclick="closeModal()">

<!-- =====================================================
     MODAL DETALLE
===================================================== -->

<div class="modal" id="detailModal">

  <div class="modal-content">

    <div class="modal-header">

      <div>
        <h3 id="detailTitle">
          Oportunidad
        </h3>

        <p id="detailSubtitle"></p>
      </div>

      <button class="close" onclick="closeDetail()">
        ×
      </button>

    </div>

    <div id="detailContent"></div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const STORAGE_KEY = "preventa_opportunities_v2";

const OLD_STORAGE_KEY = "preventa_opportunities";

let opportunities = [];

let editingId = null;


/* =====================================================
   ESTADOS
===================================================== */

const stages = [

  {
    id: "new",
    name: "Nueva",
    badge: "badge-new"
  },

  {
    id: "analysis",
    name: "En análisis",
    badge: "badge-analysis"
  },

  {
    id: "quote",
    name: "Cotizando",
    badge: "badge-quote"
  },

  {
    id: "proposal",
    name: "Propuesta",
    badge: "badge-proposal"
  },

  {
    id: "won",
    name: "Ganada",
    badge: "badge-won"
  },

  {
    id: "lost",
    name: "Perdida",
    badge: "badge-lost"
  }

];


/* =====================================================
   INICIALIZACIÓN
===================================================== */

function init() {

  loadData();

  render();

}


/* =====================================================
   CARGA DE DATOS
===================================================== */

function loadData() {

  try {

    const current =
      localStorage.getItem(STORAGE_KEY);

    if (current) {

      opportunities =
        JSON.parse(current);

      return;

    }


    /*
      MIGRACIÓN DE LA V1

      Si existían oportunidades
      en la versión anterior,
      intentamos conservarlas.
    */

    const old =
      localStorage.getItem(OLD_STORAGE_KEY);

    if (old) {

      const oldData =
        JSON.parse(old);

      opportunities =
        oldData.map(oldOpportunity =>
          migrateOldOpportunity(oldOpportunity)
        );

      saveData();

      return;

    }

    opportunities = [];

  }

  catch(error) {

    console.error(
      "Error cargando oportunidades:",
      error
    );

    opportunities = [];

  }

}


/* =====================================================
   MIGRACIÓN V1 → V2
===================================================== */

function migrateOldOpportunity(old) {

  return {

    id:
      old.id ||
      generateId(),

    createdAt:
      old.createdAt ||
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString(),

    company:
      old.client ||
      "",

    title:
      old.project ||
      "Oportunidad migrada",

    contact:
      "",

    origin:
      "Migrada V1",

    stage:
      old.status ||
      "analysis",

    owner:
      "",

    amount:
      old.amount ||
      "",

    objective:
      old.objective ||
      "",

    requirements:
      old.requirements ||
      "",

    solution:
      old.solution ||
      "",

    products:
      old.solution
        ? [old.solution]
        : [],

    risks:
      old.risks ||
      "",

    nextAction:
      "",

    nextActionDate:
      "",

    notes:
      old.notes ||
      "",

    technical: {

      users:
        old.users ||
        "",

      storage:
        old.storage ||
        "",

      documents:
        old.documents ||
        "",

      workflows:
        old.workflows ||
        "",

      ocr:
        old.ocr ||
        "",

      signatures:
        old.signatures ||
        "",

      infrastructure:
        old.infrastructure ||
        "",

      deadline:
        old.deadline ||
        ""

    }

  };

}


/* =====================================================
   GUARDADO
===================================================== */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(opportunities)
  );

}


/* =====================================================
   ID
===================================================== */

function generateId() {

  return "OP-" +
    Date.now().toString(36).toUpperCase();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   RENDER PRINCIPAL
===================================================== */

function render() {

  updateCounters();

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filterStage =
    document
      .getElementById("filterStage")
      .value;


  let filtered =
    opportunities.filter(opportunity => {

      const searchable = [

        opportunity.company,

        opportunity.title,

        opportunity.contact,

        opportunity.origin,

        opportunity.solution,

        ...(opportunity.products || [])

      ]
        .join(" ")
        .toLowerCase();


      const matchesSearch =
        !search ||
        searchable.includes(search);


      const matchesStage =
        filterStage === "all" ||
        opportunity.stage === filterStage;


      return (
        matchesSearch &&
        matchesStage
      );

    });


  const pipeline =
    document.getElementById("pipeline");

  pipeline.innerHTML = "";


  stages.forEach(stage => {

    const column =
      document.createElement("div");

    column.className =
      "column";


    const stageItems =
      filtered.filter(
        opportunity =>
          opportunity.stage === stage.id
      );


    column.innerHTML = `

      <div class="column-header">

        <strong>
          ${stage.name}
        </strong>

        <span class="column-count">
          ${stageItems.length}
        </span>

      </div>

      <div class="column-body"></div>

    `;


    const body =
      column.querySelector(".column-body");


    if (stageItems.length === 0) {

      body.innerHTML = `
        <div class="empty-column">
          Sin oportunidades
        </div>
      `;

    }
    else {

      stageItems
        .sort(
          (a,b) =>
            new Date(b.updatedAt || 0) -
            new Date(a.updatedAt || 0)
        )
        .forEach(opportunity => {

          body.appendChild(
            createCard(opportunity)
          );

        });

    }


    pipeline.appendChild(column);

  });

}


/* =====================================================
   TARJETA
===================================================== */

function createCard(opportunity) {

  const card =
    document.createElement("div");

  card.className =
    "card";


  const products =
    opportunity.products || [];


  card.innerHTML = `

    <div class="card-company">
      ${escapeHtml(opportunity.company)}
    </div>

    <div class="card-title">
      ${escapeHtml(opportunity.title)}
    </div>

    <div class="card-solution">
      ${
        products.length
          ? escapeHtml(products.join(" · "))
          : "Sin solución definida"
      }
    </div>

    <div class="card-footer">

      <span>
        ${escapeHtml(opportunity.origin || "Sin origen")}
      </span>

      <span>
        ${opportunity.nextActionDate
          ? formatDate(opportunity.nextActionDate)
          : "Sin próxima acción"}
      </span>

    </div>

  `;


  card.onclick =
    () => openDetail(opportunity.id);


  return card;

}


/* =====================================================
   CONTADORES
===================================================== */

function updateCounters() {

  stages.forEach(stage => {

    const count =
      opportunities.filter(
        opportunity =>
          opportunity.stage === stage.id
      ).length;


    const element =
      document.getElementById(
        "count-" + stage.id
      );


    if (element) {

      element.textContent =
        count;

    }

  });

}

===================================================== */

function openNewOpportunity() {

/* =====================================================
   EDITAR
===================================================== */

function editOpportunity(id) {

  const opportunity =
    opportunities.find(
      item => item.id === id
    );


  if (!opportunity) {
    return;
  }


  editingId = id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Editar oportunidad";


  document.getElementById("fCompany").value =
    opportunity.company || "";

  document.getElementById("fTitle").value =
    opportunity.title || "";

  document.getElementById("fContact").value =
    opportunity.contact || "";

  document.getElementById("fOrigin").value =
    opportunity.origin || "Comercial";

  document.getElementById("fStage").value =
    opportunity.stage || "new";

  document.getElementById("fOwner").value =
    opportunity.owner || "";

  document.getElementById("fAmount").value =
    opportunity.amount || "";

  document.getElementById("fNextDate").value =
    opportunity.nextActionDate || "";

  document.getElementById("fObjective").value =
    opportunity.objective || "";

  document.getElementById("fRequirements").value =
    opportunity.requirements || "";

  document.getElementById("fSolution").value =
    opportunity.solution || "";

  document.getElementById("fProducts").value =
    (opportunity.products || []).join(", ");

  document.getElementById("fRisks").value =
    opportunity.risks || "";

  document.getElementById("fNextAction").value =
    opportunity.nextAction || "";

  document.getElementById("fNotes").value =
    opportunity.notes || "";


  document.getElementById(
    "opportunityModal"
  ).classList.add("show");

}


/* =====================================================
   GUARDAR
===================================================== */

function saveOpportunity() {

  const company =
    document.getElementById("fCompany")
      .value
      .trim();

  const title =
    document.getElementById("fTitle")
      .value
      .trim();


  if (!company || !title) {

    alert(
      "Completá Empresa y Oportunidad."
    );

    return;

  }


  const now =
    new Date().toISOString();


  const data = {

    company,

    title,

    contact:
      document.getElementById("fContact").value.trim(),

    origin:
      document.getElementById("fOrigin").value,

    stage:
      document.getElementById("fStage").value,

    owner:
      document.getElementById("fOwner").value.trim(),

    amount:
      document.getElementById("fAmount").value,

    nextActionDate:
      document.getElementById("fNextDate").value,

    objective:
      document.getElementById("fObjective").value.trim(),

    requirements:
      document.getElementById("fRequirements").value.trim(),

    solution:
      document.getElementById("fSolution").value.trim(),

    products:
      document.getElementById("fProducts")
        .value
        .split(",")
        .map(item => item.trim())
        .filter(Boolean),

    risks:
      document.getElementById("fRisks").value.trim(),

    nextAction:
      document.getElementById("fNextAction").value.trim(),

    notes:
      document.getElementById("fNotes").value.trim()

  };


  if (editingId) {

    const index =
      opportunities.findIndex(
        item => item.id === editingId
      );


    if (index !== -1) {

      opportunities[index] = {

        ...opportunities[index],

        ...data,

        updatedAt: now

      };

    }

  }
  else {

    opportunities.unshift({

      id:
        generateId(),

      createdAt:
        now,

      updatedAt:
        now,

      ...data,

      technical: {

        users: "",
        storage: "",
        documents: "",
        workflows: "",
        ocr: "",
        signatures: "",
        infrastructure: "",
        deadline: ""

      }

    });

  }


  saveData();

  closeModal();

  render();

}

/* =====================================================

function goToQuote() {

/* =====================================================
   ELIMINAR
===================================================== */

function deleteOpportunity(id) {

  const opportunity =
    opportunities.find(
      item => item.id === id
    );


  if (!opportunity) {
    return;
  }


  const confirmed =
    confirm(
      "¿Querés eliminar la oportunidad \"" +
      opportunity.title +
      "\"?"
    );


  if (!confirmed) {
    return;
  }


  opportunities =
    opportunities.filter(
      item => item.id !== id
    );


  saveData();

  closeDetail();

  render();

}


/* =====================================================
   FORMULARIO
===================================================== */

function clearForm() {

  const fields = [

    "fCompany",
    "fTitle",
    "fContact",
    "fOwner",
    "fAmount",
    "fNextDate",
    "fObjective",
    "fRequirements",
    "fSolution",
    "fProducts",
    "fRisks",
    "fNextAction",
    "fNotes"

  ];


  fields.forEach(id => {

    document.getElementById(id).value = "";

  });


  document.getElementById(
    "fOrigin"
  ).value = "Comercial";


  document.getElementById(
    "fStage"
  ).value = "new";

}


/* =====================================================
   CERRAR MODAL
===================================================== */

function closeModal() {

  document.getElementById(
    "opportunityModal"
  ).classList.remove("show");

}


function closeDetail() {

  document.getElementById(
    "detailModal"
  ).classList.remove("show");

}


/* =====================================================
   FILTROS
===================================================== */

function clearFilters() {

  document.getElementById(
    "search"
  ).value = "";

  document.getElementById(
    "filterStage"
  ).value = "all";

  render();

}


/* =====================================================
   FECHA
===================================================== */

function formatDate(dateString) {

  if (!dateString) {
    return "—";
  }


  try {

    return new Date(
      dateString + "T00:00:00"
    ).toLocaleDateString(
      "es-AR"
    );

  }

  catch {

    return dateString;

  }

}


/* =====================================================
   CERRAR MODALES AL HACER CLICK AFUERA
===================================================== */

window.addEventListener(
  "click",
  function(event) {

    const opportunityModal =
      document.getElementById(
        "opportunityModal"
      );

    const detailModal =
      document.getElementById(
        "detailModal"
      );


    if (
      event.target ===
      opportunityModal
    ) {

      closeModal();

    }


    if (
      event.target ===
      detailModal
    ) {

      closeDetail();

    }

  }
);


/* =====================================================
   INICIAR
===================================================== */

init();
