```html
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oportunidades | PREVENTA IA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-actions h3 {
      margin: 0;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #374151;
    }

    .opportunities {
      display: grid;
      gap: 15px;
    }

    .opportunity {
      background: white;
      border-radius: 12px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.06);

    .opportunity-info p {
      margin: 5px 0;

      background: #fef3c7;

      background: #dbeafe;

      background: #e0e7ff;

    }

</head>


<body>

  <header>

    <h1>💼 PREVENTA IA</h1>

    <a href="index.html" class="back">
      ← Volver al inicio
    </a>

  </header>


  <main class="container">

    <div class="welcome">

      <h2>💼 Oportunidades</h2>

      <p>
        Centralizá y seguí tus oportunidades de Preventa desde un solo lugar.
      </p>

    </div>


    <div class="top-actions">

      <h3>Mis oportunidades</h3>

      <button onclick="openModal()">
        + Nueva oportunidad
      </button>

    </div>


    <div
      id="opportunities"
      class="opportunities"
    ></div>


  </main>


  <div
    id="modal"
    class="modal"
  >

    <div class="modal-content">

      <h3>➕ Nueva oportunidad</h3>

      <label for="client">
        Cliente
      </label>

      <input
        id="client"
        type="text"
        placeholder="Ejemplo: Banco X"
      >


      <label for="project">
        Oportunidad / Proyecto
      </label>

      <input
        id="project"
        type="text"
        placeholder="Ejemplo: Gestión documental"
      >


      <label for="solution">
        Solución principal
      </label>

      <input
        id="solution"
        type="text"
        placeholder="Ejemplo: Thuban"
      >


      <label for="status">
        Estado
      </label>

      <select id="status">

        <option value="analysis">
          🟡 En análisis
        </option>

        <option value="quote">
          🔵 Cotizando
        </option>

        <option value="proposal">
          🟣 Propuesta
        </option>

        <option value="won">
          🟢 Ganada
        </option>

        <option value="lost">
          🔴 Perdida
        </option>

      </select>


      <div class="modal-buttons">

        <button onclick="saveOpportunity()">
          Guardar
        </button>

        <button
          class="cancel"
          onclick="closeModal()"
        >
          Cancelar
        </button>

      </div>

    </div>

  </div>


  <script>

    let opportunities =
      JSON.parse(
        localStorage.getItem("preventa_opportunities")
      ) || [];


    function renderOpportunities() {

      const container =
        document.getElementById("opportunities");


      container.innerHTML = "";


      if (opportunities.length === 0) {

        container.innerHTML = `
          <div class="empty">

            <div style="font-size:40px;">
              💼
            </div>

            <h3>
              Todavía no tenés oportunidades
            </h3>

            <p>
              Creá tu primera oportunidad para comenzar
              a organizar tu trabajo de Preventa.
            </p>

          </div>
        `;

        return;

      }


      opportunities.forEach(function(opportunity, index) {

        const card =
          document.createElement("div");

        card.className = "opportunity";


        card.innerHTML = `

          <div class="opportunity-info">

            <h3>
              ${opportunity.project}
            </h3>

            <p>
              👤 Cliente: ${opportunity.client}
            </p>

            <p>
              🧩 Solución: ${opportunity.solution}
            </p>

            <span class="status ${opportunity.status}">
              ${getStatusName(opportunity.status)}
            </span>

            <div class="detail">
              Oportunidad creada desde PREVENTA IA
            </div>

          </div>

          <button onclick="deleteOpportunity(${index})">
            Eliminar
          </button>

        `;


        container.appendChild(card);

      });

    }


    function getStatusName(status) {

      const names = {

        analysis: "🟡 En análisis",

        quote: "🔵 Cotizando",

        proposal: "🟣 Propuesta",

        won: "🟢 Ganada",

        lost: "🔴 Perdida"

      };

      return names[status] || status;

    }


    function openModal() {

      document.getElementById("modal").style.display =
        "flex";

    }


    function closeModal() {

      document.getElementById("modal").style.display =
        "none";

    }


    function saveOpportunity() {

      const client =
        document.getElementById("client").value.trim();

      const project =
        document.getElementById("project").value.trim();

      const solution =
        document.getElementById("solution").value.trim();

      const status =
        document.getElementById("status").value;


      if (
        client === "" ||
        project === ""
      ) {

        alert(
          "Completá al menos el cliente y el proyecto."
        );

        return;

      }


      opportunities.push({

        client: client,

        project: project,

        solution:
          solution || "Por definir",

        status: status

      });


      localStorage.setItem(
        "preventa_opportunities",
        JSON.stringify(opportunities)
      );


      document.getElementById("client").value = "";

      document.getElementById("project").value = "";

      document.getElementById("solution").value = "";

      document.getElementById("status").value =
        "analysis";


      closeModal();

      renderOpportunities();

    }


    function deleteOpportunity(index) {

      if (
        !confirm(
          "¿Querés eliminar esta oportunidad?"
        )
      ) {

        return;

      }


      opportunities.splice(index, 1);


      localStorage.setItem(
        "preventa_opportunities",
        JSON.stringify(opportunities)
      );


      renderOpportunities();

    }


    renderOpportunities();

  </script>

</body>

</html>
